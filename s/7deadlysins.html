<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream</title><style>
html,body{height:100%;margin:0;background:#000;overflow:hidden;font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#fff}
#v{position:fixed;inset:0;width:100%;height:100%;background:#000}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;opacity:0;transform:translateY(-8px);transition:.18s;z-index:5}
#hud.show{opacity:1;transform:translateY(0)}
#bar{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.05))}
.pill{display:flex;gap:8px;align-items:center;background:rgba(20,20,20,.7);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 12px;backdrop-filter:blur(10px)}
.btn{cursor:pointer;user-select:none;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(20,20,20,.65);color:#fff;padding:8px 12px}
.btn:hover{filter:brightness(1.08)}
.btn.red{background:rgba(229,9,20,.9);border-color:rgba(229,9,20,.7)}
#drawer{position:fixed;inset:0;display:none;z-index:6}
#drawer.on{display:block}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(10px)}
#panel{position:absolute;top:0;bottom:0;right:0;width:min(420px,92vw);background:rgba(10,10,12,.88);border-left:1px solid rgba(255,255,255,.10);padding:14px;display:flex;flex-direction:column;gap:12px}
#toprow{display:flex;gap:10px;align-items:center}
#q{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;color:#fff;outline:0}
#list{overflow:auto;display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);cursor:pointer}
.item:hover{filter:brightness(1.08)}
.item.on{border-color:rgba(229,9,20,.6);background:rgba(229,9,20,.12)}
.badge{min-width:44px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-weight:700}
.meta{min-width:0}
.t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:16px;bottom:16px;z-index:7;max-width:min(720px,calc(100% - 32px));padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.65);backdrop-filter:blur(10px);opacity:0;transform:translateY(10px);transition:.18s}
#toast.show{opacity:1;transform:translateY(0)}
#hint{position:fixed;right:16px;bottom:16px;z-index:7;opacity:.55;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:8px 12px;backdrop-filter:blur(10px)}
</style></head><body>
<video id="v" controls playsinline preload="metadata"></video>

<div id="hud"><div id="bar">
  <div class="pill"><span id="stDot">●</span><span id="st">Idle</span></div>
  <div class="pill"><span id="now">No episode</span></div>
  <button class="btn" id="episodesBtn">Episodes</button>
  <button class="btn" id="prevBtn">Prev</button>
  <button class="btn red" id="nextBtn">Next</button>
  <button class="btn" id="copyBtn">Copy link</button>
</div></div>

<div id="drawer">
  <div id="shade"></div>
  <div id="panel">
    <div id="toprow">
      <input id="q" placeholder="Search...">
      <button class="btn" id="closeBtn">Close</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<div id="toast"></div>
<div id="hint">E = Episodes • Space = Pause • ←/→ = Prev/Next • F = Fullscreen</div>

<script>
(()=>{const API_BASE="https://ordinary-ancient-organisations-zen.trycloudflare.com",KEY="favnc";
const v=document.getElementById("v"),hud=document.getElementById("hud"),drawer=document.getElementById("drawer"),list=document.getElementById("list"),q=document.getElementById("q"),toast=document.getElementById("toast"),st=document.getElementById("st"),stDot=document.getElementById("stDot"),now=document.getElementById("now");
const btnEpisodes=document.getElementById("episodesBtn"),btnPrev=document.getElementById("prevBtn"),btnNext=document.getElementById("nextBtn"),btnCopy=document.getElementById("copyBtn"),btnClose=document.getElementById("closeBtn");
let items=[],view=[],idx=-1,hideHudT=null,saveT=null;

const enc=encodeURIComponent;
const api=(path)=>API_BASE+path+(path.includes("?")?"&":"?")+"key="+enc(KEY);
const nice=(s)=>String(s||"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim();
const epNum=(id)=>{const m=String(id||"").match(/(?:^|[^0-9])E(\d+)(?:[^0-9]|$)/i);return m?parseInt(m[1],10):null};
const idKey=(it)=>"resume:"+it.id;

const setStatus=(ok,msg)=>{st.textContent=msg;stDot.style.color=ok?"#39d98a":"#ffcc66"};
const showToast=(msg)=>{toast.textContent=msg;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),1400)};

const showHud=()=>{hud.classList.add("show");clearTimeout(hideHudT);hideHudT=setTimeout(()=>hud.classList.remove("show"),1400)};
document.addEventListener("mousemove",showHud,{passive:true});
document.addEventListener("pointerdown",showHud,{passive:true});

const openDrawer=()=>{drawer.classList.add("on");q.focus();showHud()};
const closeDrawer=()=>{drawer.classList.remove("on");showHud()};
document.getElementById("shade").onclick=closeDrawer;
btnEpisodes.onclick=openDrawer;
btnClose.onclick=closeDrawer;

const fetchJSON=async(url)=>{const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()};

const render=()=>{list.innerHTML="";view.forEach((it,i)=>{const a=document.createElement("div");a.className="item"+(i===idx?" on":"");const b=document.createElement("div");b.className="badge";const n=epNum(it.id);b.textContent=n!=null?("E"+n):(i+1);const m=document.createElement("div");m.className="meta";const t=document.createElement("div");t.className="t";t.textContent=nice(it.id);const s=document.createElement("div");s.className="s";s.textContent=it.video_file; m.appendChild(t);m.appendChild(s);a.appendChild(b);a.appendChild(m);a.onclick=()=>{play(i,true);closeDrawer()};list.appendChild(a)})};

const setActive=()=>{[...list.children].forEach(el=>el.classList.remove("on"));const el=list.children[idx];if(el)el.classList.add("on")};

const addTracks=(it)=>{for(const tr of [...v.querySelectorAll("track")])tr.remove();(it.subtitle_urls||[]).forEach((u,k)=>{const tr=document.createElement("track");tr.kind="subtitles";tr.srclang="en";tr.label="English"+(k?(" "+(k+1)):"");tr.src=API_BASE+u+(u.includes("?")?"&":"?")+"key="+enc(KEY);if(k===0)tr.default=true;v.appendChild(tr)})};

const play=async(i,userAction)=>{if(!view[i])return;idx=i;setActive();const it=view[i];now.textContent=nice(it.id);setStatus(true,"Loading");const url=api("/"+enc(it.video_file));v.src=url;addTracks(it);
const resume=Number(localStorage.getItem(idKey(it))||"0");
const resumeIf=()=>{if(resume>2 && isFinite(resume)){try{v.currentTime=resume;showToast("Resumed at "+Math.floor(resume)+"s")}catch{}}};
if(v.readyState>=1)resumeIf(); else v.addEventListener("loadedmetadata",resumeIf,{once:true});
try{await v.play().catch(()=>{});setStatus(true,"Playing")}catch(e){setStatus(false,"Playback error");showToast(String(e&&e.message||e))}
if(saveT)clearInterval(saveT);
saveT=setInterval(()=>{const it2=view[idx];if(!it2)return;const ct=v.currentTime||0;if(ct>1)localStorage.setItem(idKey(it2),String(ct));},1500);
if(userAction)history.replaceState(null,"",location.pathname+"?ep="+enc(it.id));
showHud();
};

const applyFilter=()=>{const s=(q.value||"").trim().toLowerCase();if(!s){view=items.slice();idx=Math.max(0,Math.min(idx,view.length-1));render();setActive();return}
view=items.filter(it=>(it.id+" "+it.video_file).toLowerCase().includes(s));idx=Math.max(0,Math.min(idx,view.length-1));render();setActive()};
q.addEventListener("input",applyFilter);

btnPrev.onclick=()=>{if(!view.length)return;play((idx-1+view.length)%view.length,true)};
btnNext.onclick=()=>{if(!view.length)return;play((idx+1)%view.length,true)};

btnCopy.onclick=async()=>{if(!view[idx])return showToast("Nothing to copy");const link=api("/"+enc(view[idx].video_file));try{await navigator.clipboard.writeText(link);showToast("Copied link")}catch{showToast("Clipboard blocked")}};

v.addEventListener("ended",()=>{if(!view.length)return;play((idx+1)%view.length,true)});

document.addEventListener("keydown",(e)=>{if(e.target&&e.target.tagName==="INPUT")return;const k=e.key.toLowerCase();
if(k==="e") drawer.classList.contains("on")?closeDrawer():openDrawer();
if(k==="arrowleft") btnPrev.click();
if(k==="arrowright") btnNext.click();
if(k===" ") {e.preventDefault();v.paused?v.play():v.pause();}
if(k==="f"){if(document.fullscreenElement)document.exitFullscreen();else v.requestFullscreen?.();}
showHud();
});

const load=async()=>{setStatus(true,"Fetching");try{
const j=await fetchJSON(api("/api/catalog"));items=(j.items||[]).slice();
items.sort((a,b)=>{const na=epNum(a.id),nb=epNum(b.id);if(na!=null&&nb!=null)return na-nb;return (a.id||"").localeCompare(b.id||"",undefined,{numeric:true,sensitivity:"base"})});
view=items.slice();const params=new URLSearchParams(location.search);const wanted=params.get("ep");idx=0;
render();
if(wanted){const k=items.findIndex(x=>x.id===wanted);if(k>=0){view=items.slice();idx=k;render();}}
setStatus(true,"Ready");showToast("Loaded "+items.length);if(items.length)play(idx,false); else {now.textContent="No episodes";}}
catch(e){setStatus(false,"API failed");showToast("API failed: "+String(e&&e.message||e));}};
load();
})();
</script>
</body></html>
