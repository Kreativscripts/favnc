<html lang="en">

<script src="https://favnc.pages.dev/web_runtime/webperms.js" defer></script>

<head>
    <meta charset="UTF-8">
    <title>Delete Discord Webhook – Nexus Command</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quickly delete Discord webhooks with Nexus Command. Simple, fast, and secure.">
    <link rel="icon" href="../../assets/discordlogo.png">
    <meta property="og:title" content="Delete Discord Webhook">
    <meta property="og:description" content="Easily delete Discord webhooks — Nexus Command.">
    <meta property="og:image" content="https://favnc.pages.dev/assets/thumbnail-tools.png">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nexus Command">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Delete Discord Webhook">
    <meta name="twitter:description" content="Instantly delete Discord webhooks with Nexus Command.">
    <meta name="twitter:image" content="https://favnc.pages.dev/assets/thumbnail-tools.png">
    <meta name="theme-color" content="#d4af37">
</head>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Segoe UI,Arial,sans-serif;
  background:radial-gradient(circle at 0% 0%,#272727 0,#050505 40%,#000 80%);
  background-size:200% 200%;
  animation:bgShift 18s ease-in-out infinite;
  color:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
@keyframes bgShift{
  0%{background-position:0 0}
  50%{background-position:100% 100%}
  100%{background-position:0 0}
}
.wrap{
  width:100%;
  max-width:520px;
  background:rgba(8,8,8,.92);
  border-radius:18px;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 26px rgba(0,0,0,.85);
  padding:22px 20px 18px;
  backdrop-filter:blur(16px);
}
.header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}
.icon{
  width:30px;
  height:30px;
  border-radius:9px;
}
.title{
  font-size:20px;
  font-weight:700;
}
.subtitle{
  font-size:12px;
  opacity:.75;
  margin-bottom:16px;
}
.label{
  font-size:13px;
  margin-bottom:4px;
}
input[type=text]{
  width:100%;
  padding:9px 10px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.18);
  background:#050505;
  color:#f5f5f5;
  font-size:13px;
}
input[type=text]:focus{
  outline:none;
  border-color:#ffd700;
  box-shadow:0 0 8px rgba(255,215,0,.4);
}
.btn-row{
  margin-top:14px;
  display:flex;
  gap:10px;
  align-items:center;
}
button{
  padding:8px 16px;
  border-radius:999px;
  border:none;
  background:linear-gradient(135deg,#ff4b4b,#ffb347);
  color:#000;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  box-shadow:0 0 14px rgba(255,90,90,.4);
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
  box-shadow:none;
}
.status{
  margin-top:14px;
  font-size:12px;
  min-height:18px;
}
.status.ok{color:#7cffd1}
.status.err{color:#ff6b6b}
.tips{
  margin-top:12px;
  font-size:11px;
  opacity:.7;
  border-top:1px solid rgba(255,255,255,.12);
  padding-top:10px;
}
code{
  background:rgba(255,255,255,.05);
  padding:2px 5px;
  border-radius:5px;
  font-size:11px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img src="../../assets/discordlogo.png" class="icon" alt="">
    <div class="title">Delete Discord Webhook</div>
  </div>
  <div class="subtitle">Paste a webhook URL and remove it from Discord. Use carefully – this cannot be undone.</div>

  <label class="label" for="url">Webhook URL</label>
  <input type="text" id="url" placeholder="https://discord.com/api/webhooks/…">

  <div class="btn-row">
    <button id="deleteBtn">Delete Webhook</button>
    <span id="loading" style="font-size:11px;opacity:.7;display:none;">Deleting…</span>
  </div>

  <div id="status" class="status"></div>

  <div class="tips">
    Tip: Make sure you’re using the full webhook URL copied from Discord.<br>
    Example: <code>https://discord.com/api/webhooks/ID/TOKEN</code>
  </div>
</div>

<script>
const urlInput = document.getElementById("url");
const statusEl = document.getElementById("status");
const btn = document.getElementById("deleteBtn");
const loading = document.getElementById("loading");

async function deleteWebhook(){
  const url = urlInput.value.trim();
  statusEl.textContent = "";
  statusEl.className = "status";

  if(!url){
    statusEl.textContent = "Please paste a webhook URL.";
    statusEl.classList.add("err");
    return;
  }
  try{
    btn.disabled = true;
    loading.style.display = "inline";
    const res = await fetch(url, {method:"DELETE"});
    if(res.ok){
      statusEl.textContent = "Webhook deleted successfully.";
      statusEl.classList.add("ok");
    }else{
      const txt = await res.text().catch(()=> "");
      statusEl.textContent = "Failed to delete webhook. HTTP " + res.status + (txt ? " – "+txt : "");
      statusEl.classList.add("err");
    }
  }catch(e){
    statusEl.textContent = "Request error. Check the URL or network.";
    statusEl.classList.add("err");
  }finally{
    btn.disabled = false;
    loading.style.display = "none";
  }
}

btn.addEventListener("click", deleteWebhook);
urlInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") deleteWebhook();
});
</script>
</body>
</html>
