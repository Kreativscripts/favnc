<!DOCTYPE html>
<html lang="en">

<script src="https://favnc.pages.dev/web_runtime/rhtml.js"></script>
<head>
<meta charset="UTF-8">
<title>Nexus Command – Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://favnc.pages.dev/assets/toolss.png">
<link rel="stylesheet" href="https://favnc.pages.dev/css/t.css">
<meta name="description" content="Utility tools by Fav_Nonchalant – Nexus Command.">
<meta name="theme-color" content="#f5c542">
<meta property="og:title" content="Nexus Command – Tools">
<meta property="og:description" content="Quick access to Discord and utility tools by Fav_Nonchalant.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://favnc.pages.dev/tools/index.html">
<meta property="og:site_name" content="Nexus Command">
<meta property="og:image" content="https://favnc.pages.dev/assets/tool-embed.png">
<meta property="og:image:secure_url" content="https://favnc.pages.dev/assets/tool-embed.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="700">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nexus Command – Tools">
<meta name="twitter:description" content="Quick access to Discord and utility tools by Fav_Nonchalant.">
<meta name="twitter:image" content="https://favnc.pages.dev/assets/tool-embed.png">

<style>
*{box-sizing:border-box}
#categories{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.cat{border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(8,8,18,.86);overflow:hidden;box-shadow:0 0 14px rgba(0,0,0,.8)}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;cursor:pointer;user-select:none;position:relative}
.cat-header:hover{background:rgba(255,255,255,.03)}
.cat-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.cat-pill{font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(245,197,66,.15);color:#f5c542;text-transform:uppercase;letter-spacing:.08em}
.cat-arrow{font-size:13px;transition:transform .18s ease-out;opacity:.8}
.cat.open .cat-arrow{transform:rotate(90deg)}
.cat-glow{position:absolute;left:0;right:0;bottom:0;height:1px;background:linear-gradient(90deg,transparent,#f5c542,transparent);opacity:.7}
.cat-meta{font-size:11px;opacity:.65;margin:0 11px 6px}
.tools{max-height:0;overflow:hidden;transition:max-height .25s ease-out}
.cat.open .tools{max-height:650px}
.tool-row{display:flex;align-items:center;font-size:12px;margin:0 9px 6px;padding:7px 8px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid transparent;position:relative;overflow:hidden}
.tool-row:first-child{margin-top:6px}
.tool-row::before{content:"";position:absolute;left:0;top:0;width:0;height:100%;background:linear-gradient(90deg,rgba(245,197,66,.18),transparent);transition:width .23s ease-out;pointer-events:none;z-index:0}
.tool-row:hover::before{width:100%}
.tool-row:hover{border-color:rgba(245,197,66,.6);box-shadow:0 0 10px rgba(245,197,66,.35)}
.tool-main,.pipe,.tool-link{position:relative;z-index:1}
.tool-main{display:flex;flex-direction:column;min-width:0}
.tool-title{white-space:nowrap;font-weight:500}
.tool-sub{font-size:10px;opacity:.7;white-space:nowrap}
.pipe{flex:1;height:1px;margin:0 7px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(245,197,66,.9));position:relative;overflow:hidden}
.pipe::after{content:"";position:absolute;left:-20%;top:-1px;width:28%;height:3px;background:radial-gradient(circle,#fff,transparent);opacity:.9;animation:flow 2.2s linear infinite}
.tool-link{color:#f5c542;text-decoration:none;font-weight:500;padding:3px 8px;border-radius:999px;background:rgba(245,197,66,.08);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tool-link:hover{text-decoration:underline;background:rgba(245,197,66,.18)}
.empty-msg{font-size:11px;opacity:.6;margin:8px 11px 6px}
@keyframes flow{0%{left:-25%}100%{left:110%}}
@media(max-width:900px){#panel{left:50%;transform:translate(-50%,-50%);padding:10px;max-width:92vw}}
</style>
</head>

<body>
<video id="bg" autoplay muted loop playsinline>
  <source src="https://favnc.pages.dev/assets/smtbg.mp4" type="video/mp4">
</video>

<div id="panel">
  <div id="title">Nexus Command – Tools</div>
  <div id="tag">Fav_Nonchalant • Hub</div>
  <div class="label">Categories</div>
  <div id="categories"></div>
</div>

<script>
const JSON_URL="https://favnc.pages.dev/database/toolpage.json";
function createCategory(name,data){
  const cat=document.createElement("div");cat.className="cat";
  const header=document.createElement("div");header.className="cat-header";
  const nameEl=document.createElement("div");nameEl.className="cat-name";
  const count=(data.tools&&data.tools.length)||0;
  nameEl.innerHTML=`<span>${name}</span><span class="cat-pill">${count} tool${count===1?"":"s"}</span>`;
  const arrow=document.createElement("div");arrow.className="cat-arrow";arrow.textContent="▶";
  const glow=document.createElement("div");glow.className="cat-glow";
  header.appendChild(nameEl);header.appendChild(arrow);header.appendChild(glow);
  const toolsWrap=document.createElement("div");toolsWrap.className="tools";
  if(data.description){
    const meta=document.createElement("div");meta.className="cat-meta";meta.textContent=data.description;toolsWrap.appendChild(meta);
  }
  if(data.tools&&data.tools.length){
    data.tools.forEach(tool=>{
      const row=document.createElement("div");row.className="tool-row";
      const main=document.createElement("div");main.className="tool-main";
      const title=document.createElement("div");title.className="tool-title";title.textContent=tool.title||tool.id||"Tool";
      main.appendChild(title);
      if(tool.subtitle){
        const sub=document.createElement("div");sub.className="tool-sub";sub.textContent=tool.subtitle;main.appendChild(sub);
      }
      const pipe=document.createElement("div");pipe.className="pipe";
      const link=document.createElement("a");link.className="tool-link";link.href=tool.url;link.textContent="Open";
      row.appendChild(main);row.appendChild(pipe);row.appendChild(link);toolsWrap.appendChild(row);
    });
  }else{
    const empty=document.createElement("div");empty.className="empty-msg";empty.textContent="No tools registered in this category yet.";toolsWrap.appendChild(empty);
  }
  header.addEventListener("click",()=>cat.classList.toggle("open"));
  cat.appendChild(header);cat.appendChild(toolsWrap);
  return cat;
}
fetch(JSON_URL).then(r=>r.json()).then(data=>{
  const container=document.getElementById("categories");
  Object.entries(data).forEach(([name,catData])=>container.appendChild(createCategory(name,catData)));
}).catch(err=>{
  const container=document.getElementById("categories");
  container.innerHTML='<div class="empty-msg">Failed to load tools list. Check toolpage.json.</div>';
  console.error(err);
});
</script>
</body>
</html>
