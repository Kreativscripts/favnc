<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fav_Pass – Password Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/Incognito.png">
<meta name="description" content="Fav_Pass – Generate insane strong passwords from 5 up to 100 characters with symbols, numbers, emoji and URL-safe options.">
<meta name="theme-color" content="#0a0a0f">
<meta property="og:title" content="Fav_Pass – Password Generator">
<meta property="og:description" content="Generate crazy-strong passwords with symbols, numbers, emoji and URL-safe output.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://favnc.pages.dev/tools/Encryption/password.html">
<meta property="og:site_name" content="Nexus Command">
<meta property="og:image" content="https://favnc.pages.dev/assets/Incognito.png">
<script src="https://favnc.pages.dev/web_runtime/console.js"></script>
<script src="https://favnc.pages.dev/web_runtime/localstorage.js"></script>
<script src="https://favnc.pages.dev/web_runtime/rhtml.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100vh;width:100vw;overflow:hidden;color:#f5f5ff}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
#panel{position:absolute;top:50%;left:9%;transform:translateY(-50%);width:360px;display:flex;flex-direction:column;gap:8px;color:#f5f5ff}
#title{font-size:1.35rem;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 0 8px #000}
#tag{font-size:.7rem;padding:3px 8px;border-radius:999px;border:1px solid rgba(200,200,255,.7);background:rgba(5,5,12,.72);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#d5d7ff;text-shadow:0 0 6px #000;margin-top:4px}
#len-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
#len-value{font-size:.8rem;color:#f1f1ff}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(80,80,95,.95);border-radius:999px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-4px;height:12px;width:12px;border-radius:50%;background:#f5f5ff;box-shadow:0 0 6px rgba(255,255,255,.7)}
input[type=range]::-moz-range-track{height:4px;background:rgba(80,80,95,.95);border-radius:999px}
input[type=range]::-moz-range-thumb{height:12px;width:12px;border-radius:50%;background:#f5f5ff;box-shadow:0 0 6px rgba(255,255,255,.7)}
.opt-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.opt{display:flex;align-items:center;font-size:.78rem;background:rgba(20,20,28,.9);padding:4px 8px;border-radius:999px;border:1px solid rgba(130,135,165,.8);box-shadow:0 0 8px rgba(0,0,0,.7)}
.opt input{margin-right:4px}
#password{margin-top:6px;padding:9px 10px;border-radius:9px;border:1px solid rgba(130,135,165,.9);background:rgba(8,8,18,.94);color:#f5f5ff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 12px rgba(0,0,0,.7)}
#strength{font-size:.75rem;color:#c0ffd5;margin-top:2px;text-shadow:0 0 5px #000}
#url-style{font-size:.8rem;color:#d5d7ff;margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace;text-shadow:0 0 5px #000;word-break:break-all}
.btn{margin-top:6px;width:100%;padding:9px 10px;border-radius:9px;border:1px solid rgba(160,160,175,.55);background:rgba(40,40,48,.88);color:#f1f1f5;font-size:.82rem;text-transform:uppercase;letter-spacing:.09em;cursor:pointer;box-shadow:0 0 10px rgba(0,0,0,.65);transition:background .15s,box-shadow .15s,transform .07s}
.btn:hover{transform:translateY(-1px);background:rgba(55,55,65,.95);box-shadow:0 0 14px rgba(190,190,220,.45)}
.btn.primary{background:rgba(65,65,75,.95);border:1px solid rgba(200,200,220,.65);color:#fafafa;box-shadow:0 0 14px rgba(200,200,220,.55)}
.btn.primary:hover{background:rgba(80,80,90,.98);box-shadow:0 0 18px rgba(200,200,220,.7)}
@media (max-width:900px){#panel{left:50%;transform:translate(-50%,-50%);padding:10px}}</style>
</head>
<body>
<video id="bg" autoplay muted loop playsinline>
  <source src="https://favnc.pages.dev/assets/smtbg.mp4" type="video/mp4">
</video>
<div id="panel">
  <div id="title">Fav_Pass</div>
  <div id="tag">Password Generator</div>

  <div id="len-row">
    <div class="label">Length</div>
    <div id="len-value">16</div>
  </div>
  <input type="range" id="len" min="5" max="100" value="16">

  <div class="label">Charset</div>
  <div class="opt-row">
    <label class="opt"><input type="checkbox" id="lower" checked>lowercase</label>
    <label class="opt"><input type="checkbox" id="upper" checked>UPPERCASE</label>
    <label class="opt"><input type="checkbox" id="digits" checked>0-9</label>
    <label class="opt"><input type="checkbox" id="symbols" checked>symbols</label>
    <label class="opt"><input type="checkbox" id="emoji">emoji</label>
    <label class="opt"><input type="checkbox" id="urlsafe">URL-safe</label>
  </div>

  <button class="btn primary" id="gen">Generate</button>
  <button class="btn" id="copy">Copy Password</button>
  <button class="btn" id="copy-url">Copy URL Style</button>

  <div class="label">Password</div>
  <div id="password"></div>
  <div id="strength"></div>

  <div class="label">URL style</div>
  <div id="url-style"></div>
</div>

<script>
const len=document.getElementById("len"),
      lenVal=document.getElementById("len-value"),
      lower=document.getElementById("lower"),
      upper=document.getElementById("upper"),
      digits=document.getElementById("digits"),
      symbols=document.getElementById("symbols"),
      emoji=document.getElementById("emoji"),
      urlsafe=document.getElementById("urlsafe"),
      pwdBox=document.getElementById("password"),
      strength=document.getElementById("strength"),
      urlBox=document.getElementById("url-style"),
      gen=document.getElementById("gen"),
      copy=document.getElementById("copy"),
      copyUrl=document.getElementById("copy-url")

const symSet="!@#$%^&*()-_=+[]{};:,.<>?/|\\~`"
const emojiSet="😀😁😂🤣😅😎😍🤡👻💀🔥✨⚡💎🧠🖤💜💥👾🤖🍀🍕🍣🥶😈"

len.oninput=()=>{lenVal.textContent=len.value}

function getCharset(){
  let chars=""
  if(urlsafe.checked){
    chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_.~"
    emoji.checked=false
    symbols.checked=false
    return {chars,flags:["lower","upper","digits","urlsafe"]}
  }
  if(lower.checked)chars+="abcdefghijklmnopqrstuvwxyz"
  if(upper.checked)chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  if(digits.checked)chars+="0123456789"
  if(symbols.checked)chars+=symSet
  if(emoji.checked)chars+=emojiSet
  if(!chars){
    lower.checked=upper.checked=digits.checked=true
    chars="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  }
  const flags=[]
  if(lower.checked)flags.push("lower")
  if(upper.checked)flags.push("upper")
  if(digits.checked)flags.push("digits")
  if(symbols.checked)flags.push("symbols")
  if(emoji.checked)flags.push("emoji")
  if(urlsafe.checked)flags.push("urlsafe")
  return{chars,flags}
}

function randomInt(max){
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max
  }
  return Math.floor(Math.random()*max)
}

function genPass(){
  const L=parseInt(len.value,10)||16
  const {chars,flags}=getCharset()
  let out=""
  for(let i=0;i<L;i++)out+=chars[randomInt(chars.length)]
  pwdBox.textContent=out
  const flagScore=flags.length
  let s="weak"
  if(L>=12&&flagScore>=3)s="medium"
  if(L>=16&&flagScore>=4)s="strong"
  if(L>=24&&flagScore>=4)s="insane"
  strength.textContent=`Length: ${L} • Sets: ${flags.join(", ")} • Strength: ${s}`
  const enc=encodeURIComponent(out)
  urlBox.textContent=`?key=${enc}`
}

gen.onclick=genPass
copy.onclick=()=>{
  const v=pwdBox.textContent
  if(!v)return
  navigator.clipboard.writeText(v).then(()=>{copy.textContent="Copied";setTimeout(()=>copy.textContent="Copy Password",900)})
}
copyUrl.onclick=()=>{
  const v=urlBox.textContent
  if(!v)return
  navigator.clipboard.writeText(v).then(()=>{copyUrl.textContent="Copied";setTimeout(()=>copyUrl.textContent="Copy URL Style",900)})
}

window.onload=genPass
</script>
</body>
</html>
