<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fav_Spot – Spotify Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/discordlogo.png">
<meta name="description" content="Fav_Spot – front-end control panel for queuing Spotify download jobs to your own backend.">
<meta name="theme-color" content="#0a0a0f">
<meta property="og:title" content="Fav_Spot – Spotify Panel">
<meta property="og:description" content="Queue Spotify track / album / playlist jobs to your own backend.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://favnc.pages.dev/tools/Downloader/spotify.html">
<meta property="og:site_name" content="Nexus Command">
<meta property="og:image" content="https://favnc.pages.dev/assets/discordlogo.png">
<script src="https://favnc.pages.dev/web_runtime/console.js" defer></script>
<script src="https://favnc.pages.dev/web_runtime/localstorage.js" defer></script>
<script src="https://favnc.pages.dev/web_runtime/rhtml.js" defer></script>
<script src="https://favnc.pages.dev/web_runtime/webperms.js" defer></script>
<script src="https://favnc.pages.dev/web_runtime/redirect_login.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100vh;width:100vw;overflow:hidden;color:#f5f5ff}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
#panel{position:absolute;top:50%;left:9%;transform:translateY(-50%);width:380px;display:flex;flex-direction:column;gap:8px;color:#f5f5ff}
#title{font-size:1.35rem;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 0 8px #000}
#tag{font-size:.7rem;padding:3px 8px;border-radius:999px;border:1px solid rgba(200,200,255,.7);background:rgba(5,5,12,.72);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
#subtitle{font-size:.78rem;color:#d5d7ff;opacity:.85;text-shadow:0 0 6px #000;margin-top:4px}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#d5d7ff;text-shadow:0 0 6px #000;margin-top:6px}
input[type=text],select{width:100%;padding:8px 10px;border-radius:9px;border:1px solid rgba(130,135,165,.9);background:rgba(14,16,28,.92);color:#fff;font-size:.86rem;outline:none;backdrop-filter:blur(10px);box-shadow:0 0 12px rgba(0,0,0,.7)}
input[type=text]:focus,select:focus{border-color:#8ba2ff;box-shadow:0 0 14px rgba(160,180,255,.85);background:rgba(18,20,36,.98)}
.row-two{display:flex;gap:8px;margin-top:4px}
.row-two>div{flex:1}
.btn{margin-top:6px;width:100%;padding:9px 10px;border-radius:9px;border:1px solid rgba(160,160,175,.55);background:rgba(40,40,48,.88);color:#f1f1f5;font-size:.82rem;text-transform:uppercase;letter-spacing:.09em;cursor:pointer;box-shadow:0 0 10px rgba(0,0,0,.65);transition:background .15s,box-shadow .15s,transform .07s}
.btn:hover{transform:translateY(-1px);background:rgba(55,55,65,.95);box-shadow:0 0 14px rgba(190,190,220,.45)}
.btn.primary{background:rgba(65,65,75,.95);border:1px solid rgba(200,200,220,.65);color:#fafafa;box-shadow:0 0 14px rgba(200,200,220,.55)}
.btn.primary:hover{background:rgba(80,80,90,.98);box-shadow:0 0 18px rgba(200,200,220,.7)}
#status{font-size:.76rem;margin-top:2px;min-height:14px}
#status.ok{color:#7cffd1}
#status.err{color:#ff6b6b}
#api-url{margin-top:6px;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace;color:#d5d7ff;text-shadow:0 0 6px #000;word-break:break-all}
#log-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#d5d7ff;text-shadow:0 0 6px #000;margin-top:8px}
#log{margin-top:2px;padding:8px;border-radius:9px;border:1px solid rgba(130,135,165,.8);background:rgba(8,8,18,.9);font-size:.78rem;max-height:150px;overflow:auto;white-space:pre-wrap;box-shadow:0 0 12px rgba(0,0,0,.7)}
@media(max-width:900px){#panel{left:50%;transform:translate(-50%,-50%);padding:10px}}</style>
</head>
<body>
<video id="bg" autoplay muted loop playsinline>
  <source src="https://favnc.pages.dev/assets/smtbg.mp4" type="video/mp4">
</video>

<div id="panel">
  <div id="title">Fav_Spot</div>
  <div id="tag">Spotify Panel</div>
  <div id="subtitle">Front-end only. Queue Spotify URLs to your own backend API that handles the actual processing.</div>

  <div class="label">Spotify URL</div>
  <input type="text" id="url" placeholder="https://open.spotify.com/track/...">

  <div class="row-two">
    <div>
      <div class="label">Mode</div>
      <select id="mode">
        <option value="track">Track</option>
        <option value="album">Album</option>
        <option value="playlist">Playlist</option>
      </select>
    </div>
    <div>
      <div class="label">Format (label only)</div>
      <select id="format">
        <option value="mp3">MP3</option>
        <option value="ogg">OGG</option>
        <option value="wav">WAV</option>
        <option value="flac">FLAC</option>
      </select>
    </div>
  </div>

  <button class="btn primary" id="queue">Queue Job</button>
  <button class="btn" id="copy-api">Copy API URL</button>
  <div id="status"></div>

  <div class="label">API preview</div>
  <div id="api-url"></div>

  <div id="log-label">Log</div>
  <div id="log">Awaiting first job…</div>
</div>

<script>
const API_ENDPOINT="/api/spotify-job"
const urlEl=document.getElementById("url")
const modeEl=document.getElementById("mode")
const formatEl=document.getElementById("format")
const statusEl=document.getElementById("status")
const apiBox=document.getElementById("api-url")
const logBox=document.getElementById("log")
const queueBtn=document.getElementById("queue")
const copyBtn=document.getElementById("copy-api")

function log(msg){
  const ts=new Date().toLocaleTimeString()
  if(logBox.textContent==="Awaiting first job…")logBox.textContent=""
  logBox.textContent+=`[${ts}] ${msg}\n`
  logBox.scrollTop=logBox.scrollHeight
}

function buildApiUrl(){
  const u=urlEl.value.trim()
  const m=modeEl.value
  const f=formatEl.value
  if(!u)return ""
  const qs=new URLSearchParams({url:u,mode:m,format:f})
  return `${API_ENDPOINT}?${qs.toString()}`
}

function isSpotifyLink(v){return /spotify\.com/i.test(v)}

queueBtn.onclick=async()=>{
  const u=urlEl.value.trim()
  statusEl.textContent=""
  statusEl.className=""
  if(!u){statusEl.textContent="Enter a Spotify URL.";statusEl.classList.add("err");return}
  if(!isSpotifyLink(u)){statusEl.textContent="That does not look like a Spotify link.";statusEl.classList.add("err");return}
  const preview=buildApiUrl()
  apiBox.textContent=preview||""
  const job={url:u,mode:modeEl.value,format:formatEl.value}
  log("Job prepared (front-end only): "+JSON.stringify(job))
  statusEl.textContent="Job prepared. Send this to your backend API."
  statusEl.classList.add("ok")
}

copyBtn.onclick=()=>{
  const p=buildApiUrl()
  if(!p){statusEl.textContent="Nothing to copy – enter a Spotify URL first.";statusEl.className="err";return}
  navigator.clipboard.writeText(p).then(()=>{
    statusEl.textContent="API URL copied.";statusEl.className="ok"
  })
}

urlEl.addEventListener("input",()=>{apiBox.textContent=buildApiUrl()})
modeEl.addEventListener("change",()=>{apiBox.textContent=buildApiUrl()})
formatEl.addEventListener("change",()=>{apiBox.textContent=buildApiUrl()})
</script>
</body>
</html>
