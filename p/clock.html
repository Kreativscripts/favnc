<!DOCTYPE html>
<html lang="en">
<script src="https://favnc.pages.dev/web_runtime/console.js"></script>
<script src="https://favnc.pages.dev/web_runtime/localstorage.js"></script>
<script src="https://favnc.pages.dev/web_runtime/rhtml.js"></script>

<head>
  <meta charset="UTF-8" />
  <title>FavTime</title>
  <link rel="icon" type="image/png" href="https://favnc.pages.dev/assets/globe.png" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#020308;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body{position:relative}
    #globeCanvas{position:fixed;inset:0;z-index:0}
    #globeCanvas canvas{width:100%;height:100%;display:block}
    .overlay{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .clock-card{pointer-events:auto;padding:18px 22px;border-radius:14px;background:rgba(0,0,0,.65);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);min-width:260px;max-width:360px}
    .brand{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .brand img{width:22px;height:22px;border-radius:999px;border:1px solid rgba(255,255,255,.18);object-fit:cover}
    .brand-main{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
    .brand-sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
    .clock-time{font-size:46px;font-weight:600;letter-spacing:.06em;margin-top:8px}
    .clock-date{font-size:13px;opacity:.7;margin-top:4px}
    .clock-tz{font-size:12px;opacity:.75;margin-top:4px}
    .clock-foot{font-size:10px;opacity:.5;margin-top:14px;letter-spacing:.18em;text-transform:uppercase}
    @media(max-width:600px){
      .clock-card{width:90%;padding:16px 18px}
      .clock-time{font-size:38px}
    }
  </style>
</head>
<body>
  <!-- 3D globe background -->
  <div id="globeCanvas"></div>

  <!-- Clock overlay -->
  <div class="overlay">
    <div class="clock-card">
      <div class="brand">
        <img src="https://favnc.pages.dev/assets/globe.png" alt="FavTime" />
        <div>
          <div class="brand-main">FavTime</div>
          <div class="brand-sub">Clock • Local Timezone</div>
        </div>
      </div>
      <div id="clock" class="clock-time">--:--:--</div>
      <div id="clockDate" class="clock-date">Detecting timezone…</div>
      <div id="tzLabel" class="clock-tz"></div>
      <div class="clock-foot">Saved in your browser</div>
    </div>
  </div>

  <!-- Three.js (you can swap these to local copies if CDN is blocked) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/examples/js/controls/OrbitControls.min.js"></script>

  <!-- Your scripts (MUST actually exist at these paths) -->
  <!-- If tz.html is inside /p, either move scripts inside /p/scripts or change these to ../scripts/... -->
  <script src="https://favnc.pages.dev/scripts/3dglobe.js"></script>
  <script src="https://favnc.pages.dev/scripts/TZdetector.js"></script>
</body>
</html>
