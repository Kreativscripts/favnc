<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pennywise Scanner V2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      color: #dbe3f0;
      font-family: system-ui, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    .status {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #8fa3c0;
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.4; }
    }

    pre {
      background: #0e1520;
      border: 1px solid #1f2a3a;
      padding: 16px;
      border-radius: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Pennywise Scanner V2</h1>
  <p>
    Initializing secure package build…
  </p>

  <div id="status" class="status">
    Preparing files…
  </div>

  <pre>
This package is built dynamically in your browser.
No server-side processing is used.
  </pre>
</div>

<script>
  async function buildAndDownloadZip() {
    const status = document.getElementById("status");
    const zip = new JSZip();

    try {
      status.textContent = "Fetching file manifest…";

      const manifestRes = await fetch("../bin/Pscanner/files.json");
      const files = await manifestRes.json();

      for (const file of files) {
        status.textContent = `Downloading: ${file}`;
        const res = await fetch(`../bin/Pscanner/${file}`);
        const data = await res.arrayBuffer();
        zip.file(file, data);
      }

      status.textContent = "Compressing package…";

      const blob = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "Pscanner.zip";
      a.click();

      URL.revokeObjectURL(url);
      status.textContent = "Download complete ✔";

    } catch (err) {
      console.error(err);
      status.textContent = "Failed to build package.";
    }
  }

  window.addEventListener("load", () => {
    setTimeout(buildAndDownloadZip, 600);
  });
</script>

</body>
</html>
