<html lang="en">
<head>

  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}

    #v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);filter:contrast(1.06) saturate(1.05) brightness(.92);transition:opacity 900ms ease,transform 1200ms ease}
    #v.show{opacity:1;transform:scale(1)}

    #veil{position:fixed;inset:0;background:radial-gradient(80% 60% at 50% 35%,rgba(0,0,0,.12),rgba(0,0,0,.78));pointer-events:none;transition:opacity 900ms ease;opacity:1}
    #veil.dim{opacity:.25}

    #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1000ms ease;z-index:30}
    #fade.on{opacity:1}

    #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:20;transform:translateZ(0);transition:opacity 900ms ease,transform 900ms ease}
    #ui.hide{opacity:0;transform:translateY(10px) scale(.985);pointer-events:none}

    #stack{width:min(760px,94vw);display:flex;flex-direction:column;gap:14px;align-items:flex-start;filter:drop-shadow(0 18px 50px rgba(0,0,0,.85))}

    #topbar{position:fixed;top:16px;right:18px;z-index:25;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;opacity:.86}

    #l1{font-size:clamp(1.12rem,2.1vw,1.55rem);font-weight:760;letter-spacing:.02em;text-shadow:0 14px 50px rgba(0,0,0,.85)}
    #l2{font-size:clamp(.92rem,1.6vw,1.05rem);opacity:.82;line-height:1.42;max-width:62ch;text-shadow:0 14px 50px rgba(0,0,0,.85)}

    #term{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    #prompt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92rem;opacity:.88}
    #name{width:min(280px,78vw);border:none;outline:none;background:transparent;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.02rem;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.22)}
    #name::placeholder{color:rgba(255,255,255,.45)}

    #row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
    #err{min-height:18px;font-size:.84rem;color:#ff5f73;opacity:.95;text-shadow:0 14px 50px rgba(0,0,0,.85)}

    .btn3d{appearance:none;border:none;cursor:pointer;color:#fff;background:transparent;padding:0;perspective:900px}
    .btn3d .face{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:10px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.18);backdrop-filter:blur(0px);transform-style:preserve-3d;transform:translateZ(0) rotateX(0deg) rotateY(0deg);transition:transform 140ms ease,box-shadow 140ms ease,border-color 140ms ease,background 160ms ease;box-shadow:0 20px 60px rgba(0,0,0,.75)}
    .btn3d .face:before{content:"";position:absolute;inset:-2px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.18),rgba(255,255,255,.0));opacity:0;transition:opacity 180ms ease}
    .btn3d:hover .face{border-color:rgba(255,255,255,.34);background:rgba(0,0,0,.24);box-shadow:0 26px 80px rgba(0,0,0,.88)}
    .btn3d:hover .face:before{opacity:1}
    .btn3d:active .face{transform:translateZ(0) scale(.985)}
    .btnTxt{font-size:.86rem;letter-spacing:.18em;text-transform:uppercase}

    #brand{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;opacity:0;transform:translateY(20px);transition:opacity 900ms ease,transform 900ms ease;z-index:25;pointer-events:none}
    #brand.show{opacity:1;transform:translateY(0)}
    #b1{font-size:clamp(2.6rem,5.4vw,4.6rem);letter-spacing:.30em;text-transform:uppercase;text-shadow:0 18px 80px rgba(0,0,0,.92)}
    #b2{font-size:clamp(.95rem,2vw,1.2rem);letter-spacing:.18em;text-transform:uppercase;opacity:.84}
    #b3{font-size:.88rem;letter-spacing:.12em;opacity:.78}

    @media(max-width:520px){
      #term{align-items:flex-end}
      #row{width:100%}
      .btn3d{width:100%}
      .btn3d .face{width:100%}
    }
  </style>
</head>

<body>
  <video id="v" src="https://favnc.pages.dev/assets/_bkgrnds_/gho.mp4" playsinline preload="auto"></video>

  <div id="veil"></div>
  <div id="fade"></div>

  <div id="topbar"><span id="ctry">Locating…</span></div>

  <div id="ui">
    <div id="stack">
      <div id="l1">Hello.</div>
      <div id="l2">I'd like to call you something. What should be your name?</div>

      <div id="term">
        <div id="prompt">favnc@login~</div>
        <input id="name" maxlength="15" autocomplete="off" spellcheck="false" placeholder="name.">
      </div>

      <div id="err"></div>

      <div id="row">
        <button class="btn3d" id="go" type="button">
          <span class="face"><span class="btnTxt">Continue</span></span>
        </button>
      </div>
    </div>
  </div>

  <div id="brand">
    <div id="b1">Nexus Command</div>
    <div id="b2">By Fav</div>
    <div id="b3">Entering…</div>
  </div>

  <script>
  (function(){
    var KEY="favnc_username", MAIN="https://favnc.pages.dev/main";

    var v=document.getElementById("v"),
        ui=document.getElementById("ui"),
        veil=document.getElementById("veil"),
        fade=document.getElementById("fade"),
        brand=document.getElementById("brand");

    var l1=document.getElementById("l1"),
        l2=document.getElementById("l2"),
        ctry=document.getElementById("ctry");

    var term=document.getElementById("term"),
        prompt=document.getElementById("prompt"),
        inp=document.getElementById("name"),
        err=document.getElementById("err"),
        btn=document.getElementById("go"),
        face=btn.querySelector(".face");

    var name=(localStorage.getItem(KEY)||"").trim();
    var ctryName="";
    var started=false, ended=false, lock=false;

    function dn(code){
      try{
        var d=new Intl.DisplayNames([navigator.language||"en"],{type:"region"});
        return d.of(code)||"";
      }catch(e){
        return "";
      }
    }

    function parseTrace(t){
      var loc=(t.match(/(?:^|\n)loc=([A-Z]{2})/)||[])[1]||"";
      var ip=(t.match(/(?:^|\n)ip=([^\n]+)/)||[])[1]||"";
      return { loc: loc, ip: (ip||"").trim() };
    }

    function safe(s){
      s=(s||"").replace(/\s+/g," ").trim();
      if(!s) return "";
      if(s.length>18) s=s.slice(0,18);
      return s.replace(/[<>"]/g,"");
    }

    function greet(){
      if(name){
        l1.textContent="Welcome back "+name+".";
        l2.textContent="Press Continue to begin.";
        term.style.display="none";
      }else{
        // Better fallback wording
        var region = ctryName ? ctryName : "your region";
        l1.textContent="Hello user from " + region + ".";
        l2.textContent="I'd like to call you something. What should be your name?";
        term.style.display="flex";
        prompt.textContent="favnc@login~";
      }
    }

    function setBtn(b){
      btn.disabled=!!b;
      btn.querySelector(".btnTxt").textContent = b ? "Loading…" : "Continue";
    }

    function tilt(e){
      var r=btn.getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width-.5;
      var y=(e.clientY-r.top)/r.height-.5;
      var rx=(-y*10).toFixed(2);
      var ry=(x*14).toFixed(2);
      face.style.transform="translateZ(0) rotateX("+rx+"deg) rotateY("+ry+"deg) translateZ(10px)";
    }

    function untilt(){
      face.style.transform="translateZ(0) rotateX(0deg) rotateY(0deg)";
    }

    btn.addEventListener("mousemove",tilt);
    btn.addEventListener("mouseleave",untilt);

    function endSeq(){
      if(ended) return;
      ended=true;
      fade.classList.add("on");
      brand.classList.add("show");
      setTimeout(function(){ window.location.href=MAIN; }, 2400);
    }

    function begin(){
      if(lock) return;
      lock=true;

      err.textContent="";

      if(!name){
        var n=safe(inp.value);
        if(!n){
          err.textContent="Enter a name.";
          lock=false;
          return;
        }
        name=n;
        try{ localStorage.setItem(KEY,name); }catch(e){}
        l1.textContent="Hello, "+name+" welcome to Nexus Command.";
        l2.textContent="";
        term.style.display="none";
      }

      setBtn(true);
      ui.classList.add("hide");
      veil.classList.add("dim");

      v.muted=false;
      v.volume=1;
      v.currentTime=0;

      var p=v.play();
      if(p && p.then){
        p.then(function(){
          started=true;
          v.classList.add("show");
          setTimeout(function(){ ui.style.display="none"; }, 2000);
          setBtn(false);
          lock=false;
        }).catch(function(){
          // Autoplay policy fallback: try muted play
          v.muted=true;
          var p2=v.play();
          if(p2 && p2.then){
            p2.then(function(){
              started=true;
              v.classList.add("show");
              setTimeout(function(){ ui.style.display="none"; }, 1600);
              setBtn(false);
              lock=false;
            }).catch(function(){
              err.textContent="Tap Continue again to start.";
              ui.classList.remove("hide");
              veil.classList.remove("dim");
              setBtn(false);
              lock=false;
            });
          }else{
            err.textContent="Tap Continue again to start.";
            ui.classList.remove("hide");
            veil.classList.remove("dim");
            setBtn(false);
            lock=false;
          }
        });
      }else{
        started=true;
        v.classList.add("show");
        setTimeout(function(){ ui.style.display="none"; }, 950);
        setBtn(false);
        lock=false;
      }
    }

    btn.addEventListener("click",begin);
    document.addEventListener("keydown",function(e){
      if(e.key==="Enter" && ui.style.display!=="none") begin();
    });
    inp.addEventListener("input",function(){
      if(err.textContent) err.textContent="";
    });

    // Country lookup (Cloudflare trace -> loc)
    fetch("/cdn-cgi/trace",{cache:"no-store"})
      .then(function(r){ return r.text(); })
      .then(function(t){
        var o=parseTrace(t);
        if(o.loc){
          ctryName = safe(dn(o.loc)) || safe(o.loc);
          ctry.textContent = ctryName || "Online";
        }else{
          ctry.textContent="Online";
        }
        greet();
      })
      .catch(function(){
        ctry.textContent="Online";
        greet();
      });

    if(!name) greet();

    v.addEventListener("ended", function(){
      if(!started || ended) return;
      endSeq();
    });

  })();
  </script>
</body>
</html>
