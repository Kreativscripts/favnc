<style>
:root{--w:#f7f7ff;--b:#000;--g:#ffd46a;--bd:rgba(255,255,255,.12);--bd2:rgba(255,255,255,.22);--glass:rgba(6,7,12,.64);--glass2:rgba(6,7,12,.82)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000;color:var(--w);overflow:hidden}
.intro{position:fixed;inset:0;background:#000}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.05);opacity:0;transition:opacity 1.2s ease}
#v.show{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s ease;z-index:9}
#fade.on{opacity:1}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
.gbox{width:min(720px,94vw);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--bd);box-shadow:0 0 0 1px rgba(255,255,255,.05),0 28px 70px rgba(0,0,0,.85);backdrop-filter:blur(18px);overflow:hidden;transform:translateZ(0)}
.gtop{padding:16px 18px 10px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between}
.gt{font-size:.82rem;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.gtag{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
.gmid{padding:16px 18px 18px}
.line{font-size:1.05rem;font-weight:650;letter-spacing:.01em;text-shadow:0 0 10px rgba(0,0,0,.75)}
.sub{margin-top:6px;font-size:.9rem;opacity:.82;line-height:1.35}
.term{margin-top:14px;display:flex;align-items:center;gap:8px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.34);padding:10px 12px}
.prompt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;color:rgba(255,255,255,.90);white-space:nowrap}
.inp{flex:1;border:none;outline:none;background:transparent;color:var(--w);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.row{margin-top:14px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(15,16,26,.82);color:var(--w);padding:9px 16px;font-size:.86rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 26px rgba(0,0,0,.75);transition:transform .12s ease,box-shadow .12s ease,background .15s ease,border-color .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 18px 36px rgba(0,0,0,.88);border-color:rgba(255,255,255,.24);background:rgba(18,19,32,.92)}
.btn:active{transform:translateY(0)}
.err{margin-top:10px;min-height:18px;font-size:.82rem;color:#ff6b6b;opacity:.95}
.hint{margin-top:10px;font-size:.78rem;opacity:.70}
.kbd{display:inline-block;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);padding:1px 7px;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem}
#brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease;z-index:11}
#brand.show{opacity:1;transform:translateY(0)}
.b1{font-size:clamp(2.6rem,5vw,4.2rem);letter-spacing:.28em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.9),0 0 20px rgba(255,255,255,.22)}
.b2{font-size:clamp(.95rem,2vw,1.2rem);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
@media(max-width:520px){.line{font-size:1rem}.term{flex-direction:column;align-items:stretch;gap:6px}.prompt{opacity:.85}}
</style>
</head><body>
<div class="intro">
<video id="v" src="https://favnc.pages.dev/assets/favintro.mp4" playsinline preload="auto"></video>
<div id="fade"></div>

<div id="gate">
  <div class="gbox">
    <div class="gtop">
      <div class="gt">Nexus Command</div>
      <div class="gtag" id="ctryTag">Locating...</div>
    </div>
    <div class="gmid">
      <div class="line" id="l1">Hello user.</div>
      <div class="sub" id="l2">I'd like to call you something. What should be your nickname?</div>

      <div class="term" id="termBox">
        <div class="prompt" id="promptTxt">favnc@login~</div>
        <input class="inp" id="nameIn" maxlength="18" autocomplete="off" spellcheck="false" placeholder="type here">
      </div>

      <div class="err" id="err"></div>

      <div class="row">
        <button class="btn" id="goBtn" type="button">Continue</button>
      </div>

      <div class="hint" id="hint">Tip: press <span class="kbd">Enter</span> to continue. Audio will start after you continue.</div>
    </div>
  </div>
</div>

<div id="brand">
  <div class="b1">Nexus Command</div>
  <div class="b2">By Fav</div>
</div>
</div>

<script>
(function(){
var KEY="favnc_username",MAIN="https://favnc.pages.dev/main";
var v=document.getElementById("v"),gate=document.getElementById("gate"),fade=document.getElementById("fade"),brand=document.getElementById("brand");
var l1=document.getElementById("l1"),l2=document.getElementById("l2"),tag=document.getElementById("ctryTag");
var term=document.getElementById("termBox"),prompt=document.getElementById("promptTxt"),inp=document.getElementById("nameIn"),err=document.getElementById("err"),btn=document.getElementById("goBtn"),hint=document.getElementById("hint");

var name=(localStorage.getItem(KEY)||"").trim();
var ctryName="your country";

function countryNameFromCode(code){
try{var dn=new Intl.DisplayNames([navigator.language||"en"],{type:"region"});return dn.of(code)||code}catch(e){return code}
}

function parseTrace(t){
var m=t.match(/(?:^|\n)loc=([A-Z]{2})/);return m&&m[1]?m[1]:"";
}

function setGreeting(){
if(name){
l1.textContent="Welcome back "+name+".";
l2.textContent="Press Continue to begin.";
term.style.display="none";
hint.innerHTML='Tip: press <span class="kbd">Enter</span> to begin. Audio will start after you continue.';
}else{
l1.textContent="Hello user from "+ctryName+".";
l2.textContent="I'd like to call you something. What should be your nickname?";
term.style.display="flex";
prompt.textContent="favnc@login~";
}
}

function safeName(s){
s=(s||"").replace(/\s+/g," ").trim();
if(!s)return"";
if(s.length>18)s=s.slice(0,18);
s=s.replace(/[<>"]/g,"");
return s;
}

function begin(){
err.textContent="";
if(!name){
var n=safeName(inp.value);
if(!n){err.textContent="Enter a nickname.";return}
name=n;
try{localStorage.setItem(KEY,name)}catch(e){}
l1.textContent="Hello, "+name+" welcome to Nexus Command.";
l2.textContent="";
}
gate.style.transition="opacity 1.0s ease,transform 1.0s ease";
gate.style.opacity="0";
gate.style.transform="scale(.98)";
setTimeout(function(){gate.style.display="none"},1050);

v.muted=false;
v.volume=1;
v.currentTime=0;
v.play().then(function(){
v.classList.add("show");
}).catch(function(){
v.muted=true;
v.play().then(function(){v.classList.add("show")}).catch(function(){});
});
}

function endSequence(){
fade.classList.add("on");
setTimeout(function(){brand.classList.add("show")},650);
setTimeout(function(){window.location.href=MAIN},2400);
}

btn.addEventListener("click",begin);
document.addEventListener("keydown",function(e){
if(e.key==="Enter"){
if(gate.style.display!=="none")begin();
}
});

inp.addEventListener("input",function(){
if(err.textContent)err.textContent="";
});

fetch("/cdn-cgi/trace",{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
var code=parseTrace(t)||"";
if(code){ctryName=countryNameFromCode(code);tag.textContent=ctryName}
else{tag.textContent="Online"}
setGreeting();
}).catch(function(){
tag.textContent="Online";
setGreeting();
});

if(!name)setGreeting();

var ended=false;
v.addEventListener("timeupdate",function(){
if(ended)return;
if(v.currentTime>=31){ended=true;endSequence()}
});
v.addEventListener("ended",function(){
if(ended)return;
ended=true;endSequence();
});
})();
</script>
</body></html>
