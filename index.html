.modal-backdrop.active{opacity:1;pointer-events:auto}
.modal{width:min(420px,92vw);background:radial-gradient(circle at top,rgba(255,212,106,.08),transparent 55%),linear-gradient(135deg,rgba(10,10,10,.98),rgba(3,3,3,.98));border-radius:20px;padding:22px 22px 18px;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(255,212,106,.28),0 18px 45px rgba(0,0,0,.95);position:relative;overflow:hidden}
