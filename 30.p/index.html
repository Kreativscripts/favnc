<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>30 Peace Nugget</title>
  <style>
    :root{
      --purple: #b16cff;
      --bg: #000;
      --card-bg: rgba(0,0,0,.55);
      --card-brd: rgba(177,108,255,.35);
      --glow: 0 0 18px rgba(177,108,255,.55), 0 0 48px rgba(177,108,255,.25);
      --blur: 18px;
    }

    /* Custom cursor */
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      cursor: url(https://r2.guns.lol/4d605d0a-1a0a-4aeb-a3be-93285d0c744e.webp) 16 16, auto !important;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: #fff;
      user-select: none;
    }

    /* Background video layer */
    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: blur(var(--blur));
      transform: scale(1.06);
      transition: opacity 900ms ease;
      pointer-events: none;
      z-index: 0;
    }
    body.revealed #bgVideo { opacity: 1; }

    /* Dark overlay to keep the palette */
    #vignette {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1200px 700px at 50% 45%, rgba(177,108,255,.10), rgba(0,0,0,.72) 55%, rgba(0,0,0,.92) 100%),
        radial-gradient(900px 600px at 50% 55%, rgba(0,0,0,.25), rgba(0,0,0,.75));
      opacity: 0;
      transition: opacity 900ms ease;
      pointer-events: none;
      z-index: 1;
    }
    body.revealed #vignette { opacity: 1; }

    /* Intro (black screen + tiny star) */
    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 3;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .35;
      z-index: 4;
      transition: opacity 400ms ease;
      pointer-events: none;
    }
    body.revealed #hint { opacity: 0; }

    /* Star */
    #starWrap {
      width: 22px;
      height: 22px;
      transform: translateZ(0);
      will-change: transform, filter, opacity;
    }
    .starSvg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 0 rgba(0,0,0,0));
    }

    /* Purple star appears after click */
    body.revealed #starWrap .starSvg {
      filter: drop-shadow(0 0 12px rgba(177,108,255,.45));
    }

    /* Flicker (subtle) */
    .flicker {
      animation: flicker 1.1s infinite ease-in-out;
    }
    @keyframes flicker {
      0%, 100% { opacity: .78; filter: drop-shadow(0 0 6px rgba(177,108,255,.35)); }
      35% { opacity: 1; filter: drop-shadow(0 0 22px rgba(177,108,255,.60)); }
      62% { opacity: .55; filter: drop-shadow(0 0 10px rgba(177,108,255,.35)); }
      82% { opacity: .92; filter: drop-shadow(0 0 26px rgba(177,108,255,.65)); }
    }

    /* Grow to fill */
    .grow {
      transition: transform 1250ms cubic-bezier(.2,.9,.15,1), opacity 600ms ease;
      transform: scale(1);
    }

    /* Canvas for shatter stars */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 500ms ease;
      filter: blur(0px);
    }
    body.particles-on #particles { opacity: 1; }

    /* Profile card (hidden until end) */
    #profile {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.985);
      width: min(560px, calc(100vw - 44px));
      padding: 22px 22px 18px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-brd);
      box-shadow: 0 22px 80px rgba(0,0,0,.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 700ms ease, transform 700ms ease;
      z-index: 5;
    }
    body.show-profile #profile { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: var(--glow);
      border: 1px solid rgba(255,255,255,.06);
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1.1;
      text-shadow: 0 0 18px rgba(177,108,255,.25);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      margin: 14px 0 14px;
      opacity: .88;
      font-size: 14px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(177,108,255,.45);
      background: rgba(177,108,255,.12);
      color: #fff;
      text-decoration: none;
      font-weight: 650;
      letter-spacing: .02em;
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition: transform 160ms ease, box-shadow 260ms ease, background 260ms ease;
    }
    .cta:hover {
      transform: translateY(-1px);
      box-shadow: var(--glow);
      background: rgba(177,108,255,.18);
    }

    /* Click catcher */
    #clickCatcher {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: transparent;
      cursor: inherit;
    }
    body.started #clickCatcher { display: none; }

    /* Accessibility: allow tab focus on CTA */
    .cta:focus-visible {
      outline: 2px solid rgba(177,108,255,.9);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <!-- Background video -->
  <video
    id="bgVideo"
    src="https://favnc.pages.dev/assets/_bkgrnds_/30.mp4"
    playsinline
    muted
    loop
    preload="auto"
  ></video>
  <div id="vignette" aria-hidden="true"></div>

  <!-- Particle canvas -->
  <canvas id="particles"></canvas>

  <!-- Stage (center star) -->
  <div id="stage" aria-hidden="true">
    <div id="starWrap" class="grow">
      <!-- Simple SVG star -->
      <svg class="starSvg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="star">
        <!-- White star initially; we recolor after click -->
        <polygon id="starPoly"
          points="50,6 61,36 93,36 67,55 76,86 50,68 24,86 33,55 7,36 39,36"
          fill="#ffffff"
        />
      </svg>
    </div>
  </div>

  <div id="hint">click anywhere</div>

  <!-- Profile card -->
  <div id="profile" aria-live="polite">
    <div class="row">
      <img class="icon" src="https://favnc.pages.dev/assets/icons/30pico.webp" alt="30 Peace Nugget icon" />
      <div class="name">30 Peace Nugget|</div>
    </div>
    <div class="sub">Wanna get rich like me? Click below</div>
    <a class="cta" href="https://favnc.pages.dev/variares" rel="noopener">
      Go
      <span aria-hidden="true">→</span>
    </a>
  </div>

  <!-- Click catcher to ensure first click starts media -->
  <div id="clickCatcher" title="Click anywhere to start" aria-label="Click anywhere to start"></div>

  <!-- Background audio (mp4 with audio track) -->
  <audio id="bgAudio" src="https://favnc.pages.dev/assets/_bkgrnds_/audio.mp4" preload="auto" loop></audio>

  <script>
    (() => {
      const body = document.body;
      const clickCatcher = document.getElementById('clickCatcher');
      const bgVideo = document.getElementById('bgVideo');
      const bgAudio = document.getElementById('bgAudio');

      const starWrap = document.getElementById('starWrap');
      const starPoly = document.getElementById('starPoly');

      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d', { alpha: true });

      let started = false;
      let particles = [];
      let rafId = 0;
      let tPrev = performance.now();

      function resize() {
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      function rand(min, max) { return min + Math.random() * (max - min); }

      function spawnParticles(count = 260) {
        particles = [];
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;

        for (let i = 0; i < count; i++) {
          const angle = rand(-Math.PI, Math.PI);
          const speed = rand(40, 280);
          particles.push({
            x: cx + rand(-8, 8),
            y: cy + rand(-8, 8),
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed * 0.35 - rand(40, 160),
            r: rand(1.2, 2.8),
            rot: rand(0, Math.PI * 2),
            vr: rand(-3, 3),
            life: rand(2.2, 4.8),
            age: 0,
            tw: rand(0.7, 1.4)  // twinkle rate
          });
        }
      }

      function drawStar(x, y, spikes, outerRadius, innerRadius, rotation) {
        let rot = rotation;
        const step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(x, y - outerRadius);
        for (let i = 0; i < spikes; i++) {
          ctx.lineTo(x + Math.cos(rot) * outerRadius, y + Math.sin(rot) * outerRadius);
          rot += step;
          ctx.lineTo(x + Math.cos(rot) * innerRadius, y + Math.sin(rot) * innerRadius);
          rot += step;
        }
        ctx.closePath();
        ctx.fill();
      }

      function animate(now) {
        const dt = Math.min(0.033, (now - tPrev) / 1000);
        tPrev = now;

        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        // falling + gravity + slight drag
        const g = 620; // px/s^2
        for (const p of particles) {
          p.age += dt;
          p.vy += g * dt;
          p.vx *= (1 - 0.05 * dt);
          p.vy *= (1 - 0.02 * dt);

          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vr * dt;

          const fade = Math.max(0, 1 - (p.age / p.life));
          const tw = 0.65 + 0.35 * Math.sin((p.age * Math.PI * 2) * p.tw);

          ctx.globalAlpha = fade * tw;
          ctx.fillStyle = 'rgba(177,108,255,1)';
          ctx.shadowBlur = 18 * fade;
          ctx.shadowColor = 'rgba(177,108,255,.55)';

          drawStar(p.x, p.y, 5, p.r * 3.2, p.r * 1.5, p.rot);

          // reset if far off-screen
          if (p.y > window.innerHeight + 120 || p.x < -140 || p.x > window.innerWidth + 140) {
            p.age = p.life; // kill
          }
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        // stop when mostly dead, then show profile
        const alive = particles.some(p => p.age < p.life);
        if (alive) {
          rafId = requestAnimationFrame(animate);
        } else {
          body.classList.add('show-profile');
          // optional: blur the particle layer a bit as profile appears
          canvas.style.filter = 'blur(6px)';
        }
      }

      async function safePlayMedia() {
        // must be called from a user gesture to avoid autoplay blocks
        try {
          bgVideo.muted = true;
          await bgVideo.play();
        } catch (_) {}

        try {
          // try unmuting audio track via separate audio element
          bgAudio.volume = 0.85;
          await bgAudio.play();
        } catch (_) {}
      }

      function startSequence() {
        if (started) return;
        started = true;
        body.classList.add('started');

        // Reveal background video
        body.classList.add('revealed');

        // Recolor star to purple + flicker
        starPoly.setAttribute('fill', 'rgba(177,108,255,1)');
        starWrap.classList.add('flicker');

        // Start media (gesture)
        safePlayMedia();

        // Step 1: slight pause then grow to full-screen
        setTimeout(() => {
          const maxDim = Math.max(window.innerWidth, window.innerHeight);
          const scale = Math.ceil((maxDim / 22) * 1.55); // fill screen
          starWrap.style.transform = `scale(${scale})`;

          // make it brighter as it grows
          starWrap.style.filter = 'drop-shadow(0 0 34px rgba(177,108,255,.75)) drop-shadow(0 0 90px rgba(177,108,255,.35))';
        }, 650);

        // Step 2: shatter into many stars
        setTimeout(() => {
          // hide the big star quickly
          starWrap.style.opacity = '0';

          // spawn particles + animate
          spawnParticles(320);
          body.classList.add('particles-on');
          canvas.style.filter = 'blur(0px)';

          tPrev = performance.now();
          cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(animate);
        }, 2050);
      }

      // Click anywhere to start
      clickCatcher.addEventListener('click', startSequence, { passive: true });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') startSequence();
      });
    })();
  </script>
</body>
</html>
