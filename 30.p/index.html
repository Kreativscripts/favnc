<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>30 Peace Nugget</title>
  <style>
    :root{
      --p:#b16cff;
      --p2:#7b39ff;
      --ink:#000;
      --glass:rgba(0,0,0,.56);
      --stroke:rgba(177,108,255,.32);
      --soft:rgba(255,255,255,.06);
      --glow: 0 0 18px rgba(177,108,255,.55), 0 0 54px rgba(123,57,255,.22);
    }
    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      background:var(--ink);
      overflow:hidden;
      color:#fff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      cursor:url(https://r2.guns.lol/4d605d0a-1a0a-4aeb-a3be-93285d0c744e.webp) 16 16, auto !important;
      user-select:none;
    }

    #introVideo{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0;
      transform:scale(1.06);
      filter:blur(16px) saturate(1.1) contrast(1.05);
      transition:opacity 900ms ease;
      pointer-events:none;
      z-index:1;
    }
    body.intro-playing #introVideo{opacity:1}

    #mainVignette{
      position:fixed;
      inset:0;
      opacity:0;
      transition:opacity 900ms ease;
      background:
        radial-gradient(1100px 720px at 50% 45%, rgba(177,108,255,.12), rgba(0,0,0,.74) 56%, rgba(0,0,0,.92) 100%),
        radial-gradient(900px 520px at 50% 60%, rgba(123,57,255,.08), rgba(0,0,0,.78));
      pointer-events:none;
      z-index:4;
    }
    body.main-on #mainVignette{opacity:1}

    #ui{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      z-index:6;
    }
    #startBtn{
      appearance:none;
      border:1px solid rgba(177,108,255,.44);
      background:linear-gradient(180deg, rgba(177,108,255,.18), rgba(0,0,0,.22));
      color:#fff;
      padding:14px 18px;
      border-radius:16px;
      font-weight:750;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:12px;
      cursor:inherit;
      box-shadow: 0 18px 70px rgba(0,0,0,.55), var(--glow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 140ms ease, filter 240ms ease, background 240ms ease;
    }
    #startBtn:hover{transform:translateY(-1px); filter:brightness(1.08)}
    #startBtn:active{transform:translateY(0px) scale(.99)}
    body.started #startBtn{opacity:0; pointer-events:none; transform:translateY(6px)}

    #centerStar{
      width:22px;
      height:22px;
      opacity:1;
      transform:scale(1);
      will-change:transform,opacity,filter;
      z-index:7;
    }
    body.started #centerStar{opacity:1}
    .starSvg{width:100%;height:100%;display:block}
    .flicker{animation:flicker 1.05s infinite ease-in-out}
    @keyframes flicker{
      0%,100%{opacity:.72; filter:drop-shadow(0 0 8px rgba(177,108,255,.35))}
      28%{opacity:1; filter:drop-shadow(0 0 22px rgba(177,108,255,.62))}
      60%{opacity:.55; filter:drop-shadow(0 0 12px rgba(177,108,255,.40))}
      84%{opacity:.95; filter:drop-shadow(0 0 28px rgba(177,108,255,.70))}
    }

    #introCanvas,#mainCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }
    #introCanvas{z-index:3; opacity:0; transition:opacity 450ms ease}
    body.intro-shatter #introCanvas{opacity:1}

    #mainCanvas{
      z-index:2;
      opacity:0;
      transition:opacity 900ms ease;
      filter: blur(0px);
    }
    body.main-on #mainCanvas{opacity:1}

    #profile{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(.985);
      width:min(620px, calc(100vw - 44px));
      padding:22px 22px 18px;
      border-radius:20px;
      background:linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,.42));
      border:1px solid var(--stroke);
      box-shadow: 0 30px 120px rgba(0,0,0,.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity:0;
      transition: opacity 750ms ease, transform 750ms ease;
      z-index:8;
    }
    body.show-profile #profile{opacity:1; transform:translate(-50%,-50%) scale(1)}

    .row{display:flex; align-items:center; gap:14px}
    .icon{
      width:54px; height:54px;
      border-radius:16px;
      object-fit:cover;
      border:1px solid var(--soft);
      box-shadow: var(--glow);
    }
    .name{
      font-size:26px;
      font-weight:850;
      letter-spacing:.01em;
      line-height:1.08;
      text-shadow: 0 0 22px rgba(177,108,255,.20);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: calc(100% - 74px);
    }
    .sub{
      margin:14px 0 14px;
      font-size:14px;
      opacity:.9;
      letter-spacing:.02em;
    }
    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 16px;
      border-radius:16px;
      text-decoration:none;
      color:#fff;
      border:1px solid rgba(177,108,255,.52);
      background:linear-gradient(180deg, rgba(177,108,255,.18), rgba(0,0,0,.18));
      box-shadow: 0 0 0 rgba(0,0,0,0);
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-size:12px;
      transition: transform 140ms ease, box-shadow 240ms ease, filter 240ms ease;
    }
    .cta:hover{transform:translateY(-1px); box-shadow: var(--glow); filter:brightness(1.07)}
    .cta:active{transform:translateY(0px) scale(.99)}
    .cta:focus-visible{outline:2px solid rgba(177,108,255,.9); outline-offset:3px}

    #clickShield{
      position:fixed;
      inset:0;
      z-index:10;
      cursor:inherit;
      background:transparent;
    }
    body.started #clickShield{display:none}
  </style>
</head>
<body>
  <video id="introVideo" src="https://favnc.pages.dev/assets/_bkgrnds_/30.mp4" playsinline muted preload="auto"></video>
  <canvas id="mainCanvas"></canvas>
  <canvas id="introCanvas"></canvas>
  <div id="mainVignette" aria-hidden="true"></div>

  <div id="ui">
    <button id="startBtn">Enter</button>
    <div id="centerStar">
      <svg class="starSvg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon id="starPoly" points="50,6 61,36 93,36 67,55 76,86 50,68 24,86 33,55 7,36 39,36" fill="#ffffff"/>
      </svg>
    </div>
  </div>

  <div id="profile">
    <div class="row">
      <img class="icon" src="https://favnc.pages.dev/assets/icons/30pico.webp" alt="icon" />
      <div class="name">30 Peace Nugget|</div>
    </div>
    <div class="sub">Wanna get rich like me? Click below</div>
    <a class="cta" href="https://favnc.pages.dev/variares" rel="noopener">Go <span aria-hidden="true">→</span></a>
  </div>

  <audio id="bgAudio" src="https://favnc.pages.dev/assets/_bkgrnds_/audio.mp4" preload="auto" loop></audio>
  <div id="clickShield" aria-label="Click to start"></div>

  <script>
    (() => {
      const body = document.body;

      const startBtn = document.getElementById('startBtn');
      const clickShield = document.getElementById('clickShield');

      const introVideo = document.getElementById('introVideo');
      const bgAudio = document.getElementById('bgAudio');

      const star = document.getElementById('centerStar');
      const starPoly = document.getElementById('starPoly');

      const introCanvas = document.getElementById('introCanvas');
      const ictx = introCanvas.getContext('2d', { alpha:true });

      const mainCanvas = document.getElementById('mainCanvas');
      const mctx = mainCanvas.getContext('2d', { alpha:true });

      let started = false;

      let introParts = [];
      let introRaf = 0;
      let introPrev = performance.now();

      let stars = [];
      let falls = [];
      let mainRaf = 0;
      let mainPrev = performance.now();

      function setupCanvas(c){
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        c.width = Math.floor(window.innerWidth * dpr);
        c.height = Math.floor(window.innerHeight * dpr);
        c.style.width = window.innerWidth + 'px';
        c.style.height = window.innerHeight + 'px';
        return dpr;
      }

      let iDpr = 1, mDpr = 1;
      function resize(){
        iDpr = setupCanvas(introCanvas);
        mDpr = setupCanvas(mainCanvas);
        ictx.setTransform(iDpr,0,0,iDpr,0,0);
        mctx.setTransform(mDpr,0,0,mDpr,0,0);
      }
      window.addEventListener('resize', resize, { passive:true });
      resize();

      const rand = (a,b)=> a + Math.random()*(b-a);

      function drawStar(ctx, x, y, spikes, outerR, innerR, rot){
        let r = rot;
        const step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(x, y - outerR);
        for(let i=0;i<spikes;i++){
          ctx.lineTo(x + Math.cos(r)*outerR, y + Math.sin(r)*outerR);
          r += step;
          ctx.lineTo(x + Math.cos(r)*innerR, y + Math.sin(r)*innerR);
          r += step;
        }
        ctx.closePath();
        ctx.fill();
      }

      async function playIntroVideo(){
        try{
          introVideo.currentTime = 0;
          await introVideo.play();
        }catch(_){}
      }

      async function playAudio(){
        try{
          bgAudio.volume = 0.9;
          await bgAudio.play();
        }catch(_){}
      }

      function introShatterSpawn(count=320){
        introParts = [];
        const cx = window.innerWidth/2, cy = window.innerHeight/2;
        for(let i=0;i<count;i++){
          const ang = rand(-Math.PI, Math.PI);
          const sp = rand(60, 340);
          introParts.push({
            x: cx + rand(-10,10),
            y: cy + rand(-10,10),
            vx: Math.cos(ang)*sp,
            vy: Math.sin(ang)*sp*0.35 - rand(40, 180),
            r: rand(1.2, 2.9),
            rot: rand(0, Math.PI*2),
            vr: rand(-3.4, 3.4),
            life: rand(2.2, 4.8),
            age: 0,
            tw: rand(0.7, 1.5)
          });
        }
      }

      function introAnimate(now){
        const dt = Math.min(0.033, (now - introPrev)/1000);
        introPrev = now;

        ictx.clearRect(0,0,window.innerWidth,window.innerHeight);

        const g = 650;
        let alive = false;

        for(const p of introParts){
          p.age += dt;
          if(p.age < p.life) alive = true;

          p.vy += g*dt;
          p.vx *= (1 - 0.05*dt);
          p.vy *= (1 - 0.02*dt);

          p.x += p.vx*dt;
          p.y += p.vy*dt;
          p.rot += p.vr*dt;

          const fade = Math.max(0, 1 - p.age/p.life);
          const tw = 0.65 + 0.35*Math.sin((p.age*Math.PI*2)*p.tw);

          ictx.globalAlpha = fade * tw;
          ictx.fillStyle = 'rgba(177,108,255,1)';
          ictx.shadowBlur = 18 * fade;
          ictx.shadowColor = 'rgba(177,108,255,.55)';
          drawStar(ictx, p.x, p.y, 5, p.r*3.2, p.r*1.5, p.rot);
        }

        ictx.globalAlpha = 1;
        ictx.shadowBlur = 0;

        if(alive){
          introRaf = requestAnimationFrame(introAnimate);
        } else {
          body.classList.remove('intro-playing','intro-shatter');
          introVideo.pause();
          introVideo.style.opacity = '0';
          introCanvas.style.opacity = '0';
          body.classList.add('main-on');
          startMain();
          setTimeout(()=> body.classList.add('show-profile'), 1400);
        }
      }

      function buildMainBackground(){
        stars = [];
        falls = [];

        const n = Math.floor((window.innerWidth * window.innerHeight) / 14000);
        const nStars = Math.max(120, Math.min(520, n));

        for(let i=0;i<nStars;i++){
          stars.push({
            x: rand(0, window.innerWidth),
            y: rand(0, window.innerHeight),
            r: rand(0.6, 1.8),
            a: rand(0.25, 0.95),
            tw: rand(0.4, 1.6),
            ph: rand(0, Math.PI*2)
          });
        }

        for(let i=0;i<140;i++){
          falls.push({
            x: rand(0, window.innerWidth),
            y: rand(-window.innerHeight, window.innerHeight),
            vx: rand(-14, 14),
            vy: rand(120, 340),
            r: rand(1.0, 2.6),
            rot: rand(0, Math.PI*2),
            vr: rand(-2.4, 2.4),
            a: rand(0.25, 0.9),
            tw: rand(0.7, 1.6)
          });
        }
      }

      function mainAnimate(now){
        const dt = Math.min(0.033, (now - mainPrev)/1000);
        mainPrev = now;

        mctx.clearRect(0,0,window.innerWidth,window.innerHeight);

        mctx.save();
        mctx.globalCompositeOperation = 'source-over';

        for(const s of stars){
          const tw = 0.65 + 0.35*Math.sin((now/1000)*s.tw + s.ph);
          mctx.globalAlpha = s.a * tw;
          mctx.fillStyle = 'rgba(255,255,255,1)';
          mctx.shadowBlur = 10 * tw;
          mctx.shadowColor = 'rgba(177,108,255,.35)';
          mctx.beginPath();
          mctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
          mctx.fill();
        }

        mctx.shadowBlur = 0;

        for(const f of falls){
          f.x += f.vx * dt;
          f.y += f.vy * dt;
          f.rot += f.vr * dt;

          if(f.y > window.innerHeight + 60){
            f.y = rand(-220, -20);
            f.x = rand(0, window.innerWidth);
          }
          if(f.x < -80) f.x = window.innerWidth + 80;
          if(f.x > window.innerWidth + 80) f.x = -80;

          const tw = 0.65 + 0.35*Math.sin((now/1000)*f.tw + f.rot);
          mctx.globalAlpha = f.a * tw;
          mctx.fillStyle = 'rgba(177,108,255,1)';
          mctx.shadowBlur = 18 * tw;
          mctx.shadowColor = 'rgba(177,108,255,.55)';
          drawStar(mctx, f.x, f.y, 5, f.r*3.0, f.r*1.35, f.rot);
        }

        mctx.restore();
        mainRaf = requestAnimationFrame(mainAnimate);
      }

      function startMain(){
        buildMainBackground();
        mainPrev = performance.now();
        cancelAnimationFrame(mainRaf);
        mainRaf = requestAnimationFrame(mainAnimate);
        playAudio();
      }

      function startSequence(){
        if(started) return;
        started = true;

        body.classList.add('started','intro-playing');

        starPoly.setAttribute('fill','rgba(177,108,255,1)');
        star.classList.add('flicker');

        playIntroVideo();

        setTimeout(() => {
          const maxDim = Math.max(window.innerWidth, window.innerHeight);
          const scale = Math.ceil((maxDim / 22) * 1.65);
          star.style.transition = 'transform 1200ms cubic-bezier(.2,.92,.16,1), opacity 520ms ease, filter 520ms ease';
          star.style.filter = 'drop-shadow(0 0 34px rgba(177,108,255,.75)) drop-shadow(0 0 92px rgba(123,57,255,.35))';
          star.style.transform = `scale(${scale})`;
        }, 680);

        setTimeout(() => {
          body.classList.add('intro-shatter');
          star.style.opacity = '0';
          introShatterSpawn(340);
          introPrev = performance.now();
          cancelAnimationFrame(introRaf);
          introRaf = requestAnimationFrame(introAnimate);
        }, 2100);
      }

      startBtn.addEventListener('click', startSequence, { passive:true });
      clickShield.addEventListener('click', startSequence, { passive:true });
      window.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') startSequence(); });
    })();
  </script>
</body>
</html>
