.hidden{display:none}

<div id="app">

<script>
(()=>{const $=s=>document.querySelector(s),svg=$("#viz"),grid=$("#grid"),crumbs=$("#crumbs"),toast=$("#toast"),modalBack=$("#modalBack"),modalBody=$("#modalBody"),modalFoot=$("#modalFoot"),modalTitle=$("#modalTitle");const LS_KEY="favstorage_fs_v1";const DB_NAME="FavStorageDB";const DB_STORE="blobs";let db=null;const now=()=>Date.now();const uid=()=>Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2);const fmtBytes=b=>{if(!b&&b!==0)return"";const u=["B","KB","MB","GB"];let i=0,n=b;while(n>=1024&&i<u.length-1){n/=1024;i++}return(n.toFixed(i?1:0)+" "+u[i])};const extOf=n=>{const i=n.lastIndexOf(".");return i>-1?n.slice(i+1).toLowerCase():""};const isTextExt=e=>["txt","md","json","csv","log","xml","yml","yaml","ini","cfg","conf","env","js","html","css","py","lua","ts"].includes(e);const showToast=t=>{toast.textContent=t;toast.classList.add("show");clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove("show"),1200)};const openModal=(title,body,foot)=>{modalTitle.textContent=title;modalBody.innerHTML="";modalBody.appendChild(body);modalFoot.innerHTML="";(foot||[]).forEach(b=>modalFoot.appendChild(b));modalBack.classList.add("show")};const closeModal=()=>modalBack.classList.remove("show");$("#modalClose").onclick=closeModal;modalBack.addEventListener("click",e=>{if(e.target===modalBack)closeModal()});
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(DB_STORE))d.createObjectStore(DB_STORE)};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function idbPut(key,blob){return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).put(blob,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function idbGet(key){return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readonly");const req=tx.objectStore(DB_STORE).get(key);req.onsuccess=()=>res(req.result||null);req.onerror=()=>rej(req.error)})}
function idbDel(key){return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
const loadFS=()=>{try{const raw=localStorage.getItem(LS_KEY);if(raw){const fs=JSON.parse(raw);if(fs&&fs.root&&fs.nodes)return fs}}catch{}const rootId="root";const fs={v:1,root:rootId,nodes:{}};fs.nodes[rootId]={id:rootId,type:"folder",name:"/",parent:null,children:[],created:now(),modified:now()};saveFS(fs);return fs};const saveFS=fs=>{fs.nodes[fs.root].modified=now();localStorage.setItem(LS_KEY,JSON.stringify(fs))};
let FS=loadFS();let CURRENT=FS.root;let CURRENT_PATH=[];let OBJECT_URLS=new Map();
function pathFromLocation(){const p=location.pathname.replace(/\/+/g,"/");const seg=p.split("/").filter(Boolean);let idx=seg.findIndex(x=>x.toLowerCase()==="inventory"||x.toLowerCase()==="inventory.html");if(idx===-1){return []}return seg.slice(idx+1)}
function setRoute(pathSegs,replace){const base="/inventory";const url=base+(pathSegs.length?"/"+pathSegs.map(encodeURIComponent).join("/"):"");(replace?history.replaceState:history.pushState)({p:pathSegs}, "", url)}
function findFolderByPath(pathSegs){let cur=FS.root;for(const raw of pathSegs){const name=decodeURIComponent(raw);const node=FS.nodes[cur];if(!node||node.type!=="folder")return FS.root;const childId=(node.children||[]).find(id=>{const c=FS.nodes[id];return c&&c.type==="folder"&&c.name===name});if(!childId)return cur;cur=childId}return cur}
function buildPathArray(folderId){const arr=[];let cur=folderId;while(cur&&cur!==FS.root){const n=FS.nodes[cur];if(!n)break;arr.unshift(n.name);cur=n.parent}return arr}
function gotoFolder(folderId,replace){CURRENT=folderId;CURRENT_PATH=buildPathArray(folderId);setRoute(CURRENT_PATH,replace);renderAll()}
window.addEventListener("popstate",()=>{const segs=pathFromLocation();const id=findFolderByPath(segs);CURRENT=id;CURRENT_PATH=buildPathArray(id);renderAll()});
function ensureUniqueName(parentId,name,type){const p=FS.nodes[parentId];let base=name,tryN=name,i=2;while((p.children||[]).some(id=>{const n=FS.nodes[id];return n&&n.type===type&&n.name===tryN})){tryN=base+" ("+i+++")"}return tryN}
function makeFolder(parentId,name){name=(name||"New Folder").trim();if(!name)return null;name=ensureUniqueName(parentId,name,"folder");const id=uid();FS.nodes[id]={id,type:"folder",name,parent:parentId,children:[],created:now(),modified:now()};FS.nodes[parentId].children.push(id);FS.nodes[parentId].modified=now();saveFS(FS);return id}
async function makeTextFile(parentId,name,content){name=(name||"note.txt").trim()||"note.txt";if(!name.includes("."))name+=".txt";name=ensureUniqueName(parentId,name,"file");const id=uid();const blob=new Blob([content||""],{type:"text/plain"});await idbPut(id,blob);FS.nodes[id]={id,type:"file",name,parent:parentId,kind:"text",mime:"text/plain",size:blob.size,ext:extOf(name),created:now(),modified:now()};FS.nodes[parentId].children.push(id);FS.nodes[parentId].modified=now();saveFS(FS);return id}
async function importFiles(parentId,fileList){const files=[...fileList];for(const f of files){const name=ensureUniqueName(parentId,f.name,"file");const id=uid();await idbPut(id,f);FS.nodes[id]={id,type:"file",name,parent:parentId,kind:f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":f.type.startsWith("audio/")?"audio":isTextExt(extOf(name))?"text":"file",mime:f.type||"application/octet-stream",size:f.size,ext:extOf(name),created:now(),modified:now()};FS.nodes[parentId].children.push(id);FS.nodes[parentId].modified=now()}saveFS(FS);showToast("Uploaded");renderAll()}
async function deleteNode(id){const n=FS.nodes[id];if(!n)return;const parent=n.parent;const delRec=async nid=>{const node=FS.nodes[nid];if(!node)return;if(node.type==="folder"){for(const c of [...(node.children||[])])await delRec(c)}else{await idbDel(nid);const ou=OBJECT_URLS.get(nid);if(ou){URL.revokeObjectURL(ou);OBJECT_URLS.delete(nid)}}delete FS.nodes[nid]};await delRec(id);if(parent&&FS.nodes[parent])FS.nodes[parent].children=FS.nodes[parent].children.filter(x=>x!==id);saveFS(FS);showToast("Deleted");renderAll()}
function renameNode(id,newName){newName=(newName||"").trim();if(!newName)return;const n=FS.nodes[id];if(!n)return;const p=FS.nodes[n.parent];if(!p)return;const t=n.type;newName=ensureUniqueName(n.parent,newName,t);n.name=newName;n.modified=now();p.modified=now();saveFS(FS);showToast("Renamed");renderAll()}
function downloadBlob(blob,name){const a=document.createElement("a");const u=URL.createObjectURL(blob);a.href=u;a.download=name||"download";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)}
function iconFor(n){if(n.type==="folder")return "folder";const e=n.ext||extOf(n.name);if(n.kind==="image")return "image";if(n.kind==="video")return "video";if(n.kind==="audio")return "audio";if(n.kind==="text")return "text";if(["zip","rar","7z"].includes(e))return "zip";if(["pdf"].includes(e))return "pdf";return "file"}
function badgeFor(n){if(n.type==="folder")return "Folder";const e=(n.ext||extOf(n.name)||"file").toUpperCase();return e}
async function getPreviewURL(fileNode){if(OBJECT_URLS.has(fileNode.id))return OBJECT_URLS.get(fileNode.id);const blob=await idbGet(fileNode.id);if(!blob)return null;const u=URL.createObjectURL(blob);OBJECT_URLS.set(fileNode.id,u);return u}
function clearObjectURLs(){for(const u of OBJECT_URLS.values())try{URL.revokeObjectURL(u)}catch{}OBJECT_URLS.clear()}
function renderCrumbs(){crumbs.innerHTML="";const make=(label,segCount)=>{const a=document.createElement("a");a.className="crumb";a.textContent=label;a.href="javascript:void(0)";a.onclick=()=>{const segs=CURRENT_PATH.slice(0,segCount);const id=findFolderByPath(segs);gotoFolder(id,false)};return a};crumbs.appendChild(make("FavStorage",0));for(let i=0;i<CURRENT_PATH.length;i++){const sep=document.createElement("span");sep.textContent="›";sep.style.opacity=".55";crumbs.appendChild(sep);crumbs.appendChild(make(CURRENT_PATH[i],i+1))}$("#sideTitle").textContent=CURRENT_PATH.length?CURRENT_PATH[CURRENT_PATH.length-1]:"Root";$("#sideSub").textContent=("/inventory"+(CURRENT_PATH.length?"/"+CURRENT_PATH.join("/"):""))}
function renderGrid(){grid.innerHTML="";const q=$("#q").value.trim().toLowerCase();const folder=FS.nodes[CURRENT];const kids=(folder.children||[]).map(id=>FS.nodes[id]).filter(Boolean);const shown=kids.filter(n=>!q||n.name.toLowerCase().includes(q));$("#count").textContent=shown.length+" item"+(shown.length===1?"":"s");shown.sort((a,b)=>a.type!==b.type?(a.type==="folder"?-1:1):a.name.localeCompare(b.name));shown.forEach(n=>{const card=document.createElement("div");card.className="item";const prev=document.createElement("div");prev.className="preview";const b=document.createElement("div");b.className="badge";b.textContent=badgeFor(n);prev.appendChild(b);const meta=document.createElement("div");meta.className="meta";const left=document.createElement("div");const nm=document.createElement("div");nm.className="name";nm.textContent=n.name;const sm=document.createElement("div");sm.className="submeta";sm.textContent=n.type==="folder"?(FS.nodes[n.id].children?.length||0)+" items":fmtBytes(n.size||0)+" • "+(n.kind||"file");left.appendChild(nm);left.appendChild(sm);const keb=document.createElement("button");keb.className="kebab";keb.innerHTML="⋯";keb.onclick=e=>{e.stopPropagation();openItemMenu(n)};meta.appendChild(left);meta.appendChild(keb);card.appendChild(prev);card.appendChild(meta);
card.onclick=async()=>{if(n.type==="folder"){gotoFolder(n.id,false);return}openViewer(n)};
grid.appendChild(card);
(async()=>{if(n.type==="folder"){prev.innerHTML=prev.innerHTML+`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" style="opacity:.9"><path d="M4 7a3 3 0 0 1 3-3h4l2 2h4a3 3 0 0 1 3 3v1H4V7Z" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/><path d="M4 10h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7Z" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/></svg>`;return}
if(n.kind==="image"){const u=await getPreviewURL(n);if(u){const img=new Image();img.src=u;prev.appendChild(img)}}
else if(n.kind==="video"){const u=await getPreviewURL(n);if(u){const v=document.createElement("video");v.src=u;v.muted=true;v.playsInline=true;v.preload="metadata";v.addEventListener("loadeddata",()=>{try{v.currentTime=Math.min(1,v.duration||1)}catch{}});prev.appendChild(v)}}
else if(n.kind==="audio"){prev.innerHTML=prev.innerHTML+`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" style="opacity:.9"><path d="M9 18a2 2 0 1 1-4 0c0-1.1.9-2 2-2 1.7 0 2 .8 2 2Z" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/><path d="M21 16a2 2 0 1 1-4 0c0-1.1.9-2 2-2 1.7 0 2 .8 2 2Z" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/><path d="M9 18V6l12-2v12" stroke="rgba(255,255,255,.75)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
else if(n.kind==="text"){const blob=await idbGet(n.id);let txt="";if(blob){try{txt=await blob.text()}catch{}}txt=txt.replace(/\s+/g," ").slice(0,120);prev.innerHTML=prev.innerHTML+`<div style="padding:12px 12px 0;color:rgba(255,255,255,.72);font-weight:650;font-size:12px;line-height:1.35">${txt||"Text document"}</div>`}
else{prev.innerHTML=prev.innerHTML+`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" style="opacity:.9"><path d="M7 4h7l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/><path d="M14 4v4h4" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/></svg>`}
})();
})}
function openItemMenu(n){const body=document.createElement("div");body.style.display="grid";body.style.gap="10px";
const mkBtn=(txt,fn)=>{const b=document.createElement("button");b.className="btn";b.textContent=txt;b.onclick=async()=>{try{await fn()}finally{closeModal()}};return b};
const bWrap=document.createElement("div");bWrap.style.display="flex";bWrap.style.gap="10px";bWrap.style.flexWrap="wrap";
bWrap.appendChild(mkBtn("Rename",()=>promptRename(n)));
if(n.type==="folder"){bWrap.appendChild(mkBtn("Open",()=>gotoFolder(n.id,false)));bWrap.appendChild(mkBtn("Delete",()=>deleteNode(n.id)))}
else{bWrap.appendChild(mkBtn("Open",()=>openViewer(n)));bWrap.appendChild(mkBtn("Download",async()=>{const blob=await idbGet(n.id);if(blob)downloadBlob(blob,n.name)}));bWrap.appendChild(mkBtn("Delete",()=>deleteNode(n.id)))}
body.appendChild(bWrap);
openModal(n.name,body,[mkCloseBtn()])
}
function mkCloseBtn(){const b=document.createElement("button");b.className="btn ghost";b.textContent="Close";b.onclick=closeModal;return b}
function promptRename(n){const body=document.createElement("div");const f=document.createElement("div");f.className="field";const lab=document.createElement("label");lab.textContent="New name";const inp=document.createElement("input");inp.value=n.name;inp.autofocus=true;f.appendChild(lab);f.appendChild(inp);body.appendChild(f);const ok=document.createElement("button");ok.className="btn";ok.textContent="Save";ok.onclick=()=>{renameNode(n.id,inp.value);closeModal()};const cancel=mkCloseBtn();openModal("Rename",body,[cancel,ok])}
async function openViewer(n){const blob=await idbGet(n.id);if(!blob){showToast("Missing file");return}
const body=document.createElement("div");const title=document.createElement("h2");title.textContent=n.name;const p=document.createElement("p");p.textContent=(n.kind||"file")+" • "+fmtBytes(n.size||blob.size)+" • "+(n.mime||blob.type||"");body.appendChild(title);body.appendChild(p);
const box=document.createElement("div");box.className="detail";
const head=document.createElement("div");head.className="head";head.innerHTML=`<div class="t">Preview</div><div class="mini">${new Date(n.modified||now()).toLocaleString()}</div>`;const bd=document.createElement("div");bd.className="body";
const u=URL.createObjectURL(blob);
let prevEl=null;
if(n.kind==="image"){prevEl=new Image();prevEl.src=u;prevEl.style.width="100%";prevEl.style.borderRadius="14px"}
else if(n.kind==="video"){prevEl=document.createElement("video");prevEl.src=u;prevEl.controls=true;prevEl.playsInline=true;prevEl.style.width="100%";prevEl.style.borderRadius="14px"}
else if(n.kind==="audio"){prevEl=document.createElement("audio");prevEl.src=u;prevEl.controls=true;prevEl.style.width="100%"}
else if(n.kind==="text"){const t=document.createElement("textarea");t.value=await blob.text();t.style.width="100%";t.style.minHeight="240px";t.style.borderRadius="14px";t.style.fontFamily='ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace';t.style.fontSize="12.5px";prevEl=t;const save=document.createElement("button");save.className="btn";save.textContent="Save changes";save.onclick=async()=>{const nb=new Blob([t.value],{type:"text/plain"});await idbPut(n.id,nb);n.size=nb.size;n.modified=now();FS.nodes[n.id]=n;FS.nodes[n.parent].modified=now();saveFS(FS);showToast("Saved");renderAll()};bd.appendChild(save);bd.appendChild(document.createElement("div")).style.height="10px"}
else{const a=document.createElement("button");a.className="btn";a.textContent="Download";a.onclick=()=>downloadBlob(blob,n.name);prevEl=a}
if(prevEl)bd.appendChild(prevEl);
bd.appendChild(document.createElement("div")).style.height="10px";
const info=document.createElement("div");info.className="detail";info.style.marginTop="12px";info.innerHTML=`<div class="head"><div class="t">Details</div><div class="mini">local</div></div><div class="body">
<div class="row"><div class="mini">Type</div><div>${n.type}</div></div>
<div class="row"><div class="mini">Kind</div><div>${n.kind||"file"}</div></div>
<div class="row"><div class="mini">Size</div><div>${fmtBytes(n.size||blob.size)}</div></div>
<div class="row"><div class="mini">Created</div><div>${new Date(n.created||now()).toLocaleString()}</div></div>
<div class="row"><div class="mini">Modified</div><div>${new Date(n.modified||now()).toLocaleString()}</div></div>
</div>`;
body.appendChild(box);box.appendChild(head);box.appendChild(bd);body.appendChild(info);
const dl=document.createElement("button");dl.className="btn";dl.textContent="Download";dl.onclick=()=>downloadBlob(blob,n.name);
const del=document.createElement("button");del.className="btn danger";del.textContent="Delete";del.onclick=async()=>{await deleteNode(n.id);closeModal()};
const close=mkCloseBtn();
openModal("Viewer",body,[close,del,dl]);
modalBack._revoke=()=>{try{URL.revokeObjectURL(u)}catch{}}
}
modalBack.addEventListener("transitionend",()=>{if(!modalBack.classList.contains("show")&&modalBack._revoke){modalBack._revoke();modalBack._revoke=null}});
function renderViz(){const W=1000,H=700,cx=500,cy=350;svg.innerHTML="";
const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
defs.innerHTML=`<radialGradient id="coreG" cx="50%" cy="40%"><stop offset="0%" stop-color="rgba(255,255,255,.16)"/><stop offset="55%" stop-color="rgba(255,255,255,.06)"/><stop offset="100%" stop-color="rgba(255,255,255,.02)"/></radialGradient>
<radialGradient id="nodeG" cx="50%" cy="35%"><stop offset="0%" stop-color="rgba(255,255,255,.14)"/><stop offset="100%" stop-color="rgba(255,255,255,.03)"/></radialGradient>`;
svg.appendChild(defs);
const ring=(r,op)=>{const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",r);c.setAttribute("fill","none");c.setAttribute("stroke","rgba(255,255,255,.10)");c.setAttribute("stroke-width","1");c.setAttribute("opacity",op);c.setAttribute("class","glowRing");return c};
svg.appendChild(ring(72,.55));svg.appendChild(ring(110,.32));svg.appendChild(ring(155,.22));svg.appendChild(ring(210,.16));
const coreG=document.createElementNS("http://www.w3.org/2000/svg","g");coreG.setAttribute("class","node core");
const coreC=document.createElementNS("http://www.w3.org/2000/svg","circle");coreC.setAttribute("cx",cx);coreC.setAttribute("cy",cy);coreC.setAttribute("r","56");coreC.setAttribute("fill","url(#coreG)");coreC.setAttribute("stroke","rgba(255,255,255,.18)");coreC.setAttribute("stroke-width","1.2");
const coreT=document.createElementNS("http://www.w3.org/2000/svg","text");coreT.setAttribute("x",cx);coreT.setAttribute("y",cy+5);coreT.setAttribute("text-anchor","middle");coreT.textContent="FavStorage";
coreG.appendChild(coreC);coreG.appendChild(coreT);coreG.style.cursor="pointer";coreG.addEventListener("click",()=>gotoFolder(FS.root,false));svg.appendChild(coreG);
const root=FS.nodes[FS.root];const topFolders=(root.children||[]).map(id=>FS.nodes[id]).filter(n=>n&&n.type==="folder");
const count=Math.max(1,topFolders.length);const baseR=260;const nodes=[];
topFolders.forEach((f,i)=>{const ang=(Math.PI*2)*(i/count)-Math.PI/2;const x=cx+Math.cos(ang)*baseR;const y=cy+Math.sin(ang)*baseR;nodes.push({id:f.id,name:f.name,x,y,ang,depth:1,parent:FS.root,kind:"folder"});
const kids=(FS.nodes[f.id].children||[]).map(id=>FS.nodes[id]).filter(n=>n&&n.type==="folder");
kids.forEach((sf,j)=>{const rr=baseR+110+Math.min(180,Math.max(0,kids.length-3)*18);const jitter=((j-(kids.length-1)/2))*18;const x2=cx+Math.cos(ang)*(rr)+(Math.sin(ang)*jitter);const y2=cy+Math.sin(ang)*(rr)-(Math.cos(ang)*jitter);nodes.push({id:sf.id,name:sf.name,x:x2,y:y2,ang,depth:2,parent:f.id,kind:"folder",small:true})})
});
const line=(x1,y1,x2,y2,cls)=>{const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("class",cls||"line");return l};
nodes.forEach(n=>{const p=n.parent===FS.root?{x:cx,y:cy}:nodes.find(z=>z.id===n.parent)||{x:cx,y:cy};svg.appendChild(line(p.x,p.y,n.x,n.y,n.depth===1?"line":"line2"))});
const mkNode=(n)=>{const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","node"+(n.small?" small":""));const r=n.depth===1?38:30;
const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",n.x);c.setAttribute("cy",n.y);c.setAttribute("r",r);c.setAttribute("fill","url(#nodeG)");c.setAttribute("stroke","rgba(255,255,255,.18)");c.setAttribute("stroke-width","1.1");c.setAttribute("opacity",n.depth===1?".95":".88");
const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",n.x);t.setAttribute("y",n.y+4);t.setAttribute("text-anchor","middle");
t.textContent=n.name.length>16?(n.name.slice(0,15)+"…"):n.name;
g.appendChild(c);g.appendChild(t);g.style.cursor="pointer";g.addEventListener("click",()=>gotoFolder(n.id,false));
return g};
nodes.forEach(n=>svg.appendChild(mkNode(n)));
}
function renderAll(){renderCrumbs();renderGrid();renderViz()}
$("#q").addEventListener("input",renderGrid);
$("#btnUp").onclick=()=>{if(CURRENT===FS.root)return;const p=FS.nodes[CURRENT]?.parent||FS.root;gotoFolder(p,false)};
$("#btnNewFolder").onclick=()=>{const body=document.createElement("div");const f=document.createElement("div");f.className="field";const lab=document.createElement("label");lab.textContent="Folder name";const inp=document.createElement("input");inp.placeholder="e.g. videos";inp.autofocus=true;f.appendChild(lab);f.appendChild(inp);body.appendChild(f);const ok=document.createElement("button");ok.className="btn";ok.textContent="Create";ok.onclick=()=>{const id=makeFolder(CURRENT,inp.value);closeModal();if(id)gotoFolder(CURRENT,true)};openModal("New Folder",body,[mkCloseBtn(),ok])};
$("#btnNewText").onclick=()=>{const body=document.createElement("div");const f1=document.createElement("div");f1.className="field";const l1=document.createElement("label");l1.textContent="File name";const name=document.createElement("input");name.value="note.txt";f1.appendChild(l1);f1.appendChild(name);const f2=document.createElement("div");f2.className="field";const l2=document.createElement("label");l2.textContent="Content";const ta=document.createElement("textarea");ta.placeholder="Write something...";f2.appendChild(l2);f2.appendChild(ta);body.appendChild(f1);body.appendChild(f2);const ok=document.createElement("button");ok.className="btn";ok.textContent="Create";ok.onclick=async()=>{await makeTextFile(CURRENT,name.value,ta.value);closeModal();renderAll();showToast("Created")};openModal("New Text Document",body,[mkCloseBtn(),ok])};
$("#filePick").addEventListener("change",async e=>{const fl=e.target.files;if(!fl||!fl.length)return;await importFiles(CURRENT,fl);e.target.value=""});
$("#btnExport").onclick=async()=>{const payload=JSON.stringify({fs:FS,exportedAt:now()},null,2);const blob=new Blob([payload],{type:"application/json"});downloadBlob(blob,"favstorage-export.json")};
$("#importPick").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{const txt=await f.text();const obj=JSON.parse(txt);if(!obj||!obj.fs||!obj.fs.nodes||!obj.fs.root)throw new Error("Invalid");FS=obj.fs;saveFS(FS);CURRENT=findFolderByPath(pathFromLocation());CURRENT_PATH=buildPathArray(CURRENT);showToast("Imported");renderAll()}catch{showToast("Import failed")}e.target.value=""});
$("#btnReset").onclick=()=>{const body=document.createElement("div");body.innerHTML=`<h2 style="margin:0 0 8px;font-size:14px">Reset FavStorage</h2><p style="margin:0;color:rgba(255,255,255,.68);font-size:12.5px;line-height:1.45">This deletes your local folder tree and all stored blobs (on this device/browser).</p>`;const ok=document.createElement("button");ok.className="btn danger";ok.textContent="Reset";ok.onclick=async()=>{try{clearObjectURLs();localStorage.removeItem(LS_KEY);FS=loadFS();await new Promise((res,rej)=>{const r=indexedDB.deleteDatabase(DB_NAME);r.onsuccess=()=>res();r.onerror=()=>rej();r.onblocked=()=>res()});await idbOpen();CURRENT=FS.root;CURRENT_PATH=[];setRoute([],true);closeModal();showToast("Reset");renderAll()}catch{closeModal();showToast("Reset failed")}};openModal("Reset",body,[mkCloseBtn(),ok])};
(async()=>{await idbOpen();const segs=pathFromLocation();const id=findFolderByPath(segs);CURRENT=id;CURRENT_PATH=buildPathArray(id);renderAll()})()
})();
</script>
</body></html>
