<body data-theme="dark">
  <div id="app">
    <section class="card" id="mapCard">
      <div class="topbar">

          <div class="brandMark"></div>

          <button class="btn" id="btnNewText">Text</button>
          <label class="btn ghost red" title="Upload files">
            Upload

          </label>

      </div>

    <section class="card" id="browserCard">
      <div class="topbar">
        <div class="brand">
          <div class="brandMark" style="background:var(--blue);box-shadow:6px 0 0 var(--red),12px 0 0 var(--yellow)"></div>
          <div class="stack">
            <div class="brandTitle" id="folderTitle">Root</div>
            <div class="brandSub" id="folderSub">browse • preview • manage</div>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="btnUp">Up</button>
          <button class="btn red" id="btnReset">Reset</button>

      </div>

      <div class="subbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="search">
          <span style="font-weight:950">Q</span>
          <input id="q" placeholder="Search..." autocomplete="off">
        </div>
      </div>

      <div class="grid" id="grid"></div>

      <div class="footer">
        <div><span id="count">0 items</span> • <span id="usage">client-side</span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end">
          <button class="btn ghost" id="btnOpenFolderRoute">Copy Route</button>
        </div>
      </div>
    </section>
  </div>

  <div class="backdrop" id="backdrop">
    <div class="modal">
      <div class="mh">
        <div class="t" id="modalTitle">Modal</div>
        <button class="btn ghost" id="modalClose">Close</button>
      </div>
      <div class="mb" id="modalBody"></div>
      <div class="mf" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast">Saved</div>

  <script>
    (function(){
      var $=function(s){return document.querySelector(s)};
      var body=document.body, svg=$("#viz"), grid=$("#grid"), crumbs=$("#crumbs"), toast=$("#toast");
      var backdrop=$("#backdrop"), modalTitle=$("#modalTitle"), modalBody=$("#modalBody"), modalFoot=$("#modalFoot");
      var LS_KEY="favstorage_fs_v2";
      var DB_NAME="FavStorageDB";
      var DB_STORE="blobs";
      var db=null;
      var OBJECT_URLS=new Map();
      function now(){return Date.now()}
      function uid(){return Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2)}
      function fmtBytes(b){if(b===undefined||b===null)return"";var u=["B","KB","MB","GB","TB"];var i=0,n=b;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i? n.toFixed(1): String(n|0))+" "+u[i]}
      function extOf(name){var i=name.lastIndexOf(".");return i>-1?name.slice(i+1).toLowerCase():""}
      function isTextExt(e){return ["txt","md","json","csv","log","xml","yml","yaml","ini","cfg","conf","env","js","html","css","py","lua","ts"].indexOf(e)>-1}
      function showToast(t){toast.textContent=t;toast.classList.add("show");clearTimeout(showToast._t);showToast._t=setTimeout(function(){toast.classList.remove("show")},1200)}
      function openModal(title, bodyNode, footButtons){modalTitle.textContent=title;modalBody.innerHTML="";modalFoot.innerHTML="";modalBody.appendChild(bodyNode);(footButtons||[]).forEach(function(b){modalFoot.appendChild(b)});backdrop.classList.add("show")}
      function closeModal(){backdrop.classList.remove("show")}
      $("#modalClose").addEventListener("click",closeModal);
      backdrop.addEventListener("click",function(e){if(e.target===backdrop)closeModal()});
      function idbOpen(){return new Promise(function(res,rej){var r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE)};r.onsuccess=function(){db=r.result;res(db)};r.onerror=function(){rej(r.error)}})}
      function idbPut(key,blob){return new Promise(function(res,rej){var tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).put(blob,key);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})}
      function idbGet(key){return new Promise(function(res,rej){var tx=db.transaction(DB_STORE,"readonly");var req=tx.objectStore(DB_STORE).get(key);req.onsuccess=function(){res(req.result||null)};req.onerror=function(){rej(req.error)}})}
      function idbDel(key){return new Promise(function(res,rej){var tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).delete(key);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})}
      function loadFS(){try{var raw=localStorage.getItem(LS_KEY);if(raw){var fs=JSON.parse(raw);if(fs&&fs.root&&fs.nodes)return fs}}catch(e){}var rootId="root";var fs2={v:2,root:rootId,nodes:{}};fs2.nodes[rootId]={id:rootId,type:"folder",name:"/",parent:null,children:[],created:now(),modified:now()};saveFS(fs2);return fs2}
      function saveFS(fs){try{localStorage.setItem(LS_KEY,JSON.stringify(fs))}catch(e){}}
      var FS=loadFS();
      var CURRENT=FS.root;
      var CURRENT_PATH=[];
      function pathFromLocation(){var p=location.pathname.replace(/\/+/g,"/");var seg=p.split("/").filter(Boolean);var idx=-1;for(var i=0;i<seg.length;i++){var s=seg[i].toLowerCase();if(s==="inventory"||s==="inventory.html"){idx=i;break}}if(idx===-1)return[];return seg.slice(idx+1).map(function(x){return decodeURIComponent(x)})}
      function setRoute(pathSegs, replace){var base="/inventory";var url=base+(pathSegs.length?("/"+pathSegs.map(encodeURIComponent).join("/")):"");(replace?history.replaceState:history.pushState)({p:pathSegs},"",url);$("#routeLabel").textContent=url;$("#folderSub").textContent=url}
      function buildPathArray(folderId){var arr=[],cur=folderId;while(cur&&cur!==FS.root){var n=FS.nodes[cur];if(!n)break;arr.unshift(n.name);cur=n.parent}return arr}
      function findFolderByPath(pathSegs){var cur=FS.root;for(var i=0;i<pathSegs.length;i++){var name=pathSegs[i];var node=FS.nodes[cur];if(!node||node.type!=="folder")return FS.root;var childId=null;for(var j=0;j<(node.children||[]).length;j++){var cid=node.children[j];var c=FS.nodes[cid];if(c&&c.type==="folder"&&c.name===name){childId=cid;break}}if(!childId)return cur;cur=childId}return cur}
      function gotoFolder(folderId, replace){CURRENT=folderId;CURRENT_PATH=buildPathArray(folderId);setRoute(CURRENT_PATH,!!replace);renderAll()}
      window.addEventListener("popstate",function(){var segs=pathFromLocation();var id=findFolderByPath(segs);CURRENT=id;CURRENT_PATH=buildPathArray(id);setRoute(CURRENT_PATH,true);renderAll()});
      function ensureUniqueName(parentId,name,type){var p=FS.nodes[parentId];var base=name,tryN=name,i=2;while((p.children||[]).some(function(id){var n=FS.nodes[id];return n&&n.type===type&&n.name===tryN})){tryN=base+" ("+(i++)+")"}return tryN}
      function makeFolder(parentId,name){name=(name||"New Folder").trim();if(!name)return null;name=ensureUniqueName(parentId,name,"folder");var id=uid();FS.nodes[id]={id:id,type:"folder",name:name,parent:parentId,children:[],created:now(),modified:now()};FS.nodes[parentId].children.push(id);FS.nodes[parentId].modified=now();saveFS(FS);return id}
      async function makeTextFile(parentId,name,content){name=(name||"note.txt").trim()||"note.txt";if(name.indexOf(".")===-1)name+=".txt";name=ensureUniqueName(parentId,name,"file");var id=uid();var blob=new Blob([content||""],{type:"text/plain"});await idbPut(id,blob);FS.nodes[id]={id:id,type:"file",name:name,parent:parentId,kind:"text",mime:"text/plain",size:blob.size,ext:extOf(name),created:now(),modified:now()};FS.nodes[parentId].children.push(id);FS.nodes[parentId].modified=now();saveFS(FS);return id}
      async function importFiles(parentId,fileList){var files=[].slice.call(fileList);for(var i=0;i<files.length;i++){var f=files[i];var nm=ensureUniqueName(parentId,f.name,"file");var id=uid();await idbPut(id,f);var kind=f.type.indexOf("image/")===0?"image":f.type.indexOf("video/")===0?"video":f.type.indexOf("audio/")===0?"audio":(isTextExt(extOf(nm))?"text":"file");FS.nodes[id]={id:id,type:"file",name:nm,parent:parentId,kind:kind,mime:f.type||"application/octet-stream",size:f.size,ext:extOf(nm),created:now(),modified:now()};FS.nodes[parentId].children.push(id);FS.nodes[parentId].modified=now()}saveFS(FS);showToast("Uploaded");renderAll()}
      async function deleteNode(id){var n=FS.nodes[id];if(!n)return;var parent=n.parent;async function delRec(nid){var node=FS.nodes[nid];if(!node)return;if(node.type==="folder"){var kids=(node.children||[]).slice();for(var k=0;k<kids.length;k++)await delRec(kids[k])}else{await idbDel(nid);var ou=OBJECT_URLS.get(nid);if(ou){try{URL.revokeObjectURL(ou)}catch(e){}OBJECT_URLS.delete(nid)}}delete FS.nodes[nid]}await delRec(id);if(parent&&FS.nodes[parent]){FS.nodes[parent].children=(FS.nodes[parent].children||[]).filter(function(x){return x!==id});FS.nodes[parent].modified=now()}saveFS(FS);showToast("Deleted");renderAll()}
      function renameNode(id,newName){newName=(newName||"").trim();if(!newName)return;var n=FS.nodes[id];if(!n)return;newName=ensureUniqueName(n.parent,newName,n.type);n.name=newName;n.modified=now();if(FS.nodes[n.parent])FS.nodes[n.parent].modified=now();saveFS(FS);showToast("Renamed");renderAll()}
      function clearObjectURLs(){OBJECT_URLS.forEach(function(u){try{URL.revokeObjectURL(u)}catch(e){}});OBJECT_URLS.clear()}
      async function getPreviewURL(fileNode){if(OBJECT_URLS.has(fileNode.id))return OBJECT_URLS.get(fileNode.id);var blob=await idbGet(fileNode.id);if(!blob)return null;var u=URL.createObjectURL(blob);OBJECT_URLS.set(fileNode.id,u);return u}
      function downloadBlob(blob,name){var a=document.createElement("a");var u=URL.createObjectURL(blob);a.href=u;a.download=name||"download";document.body.appendChild(a);a.click();setTimeout(function(){try{URL.revokeObjectURL(u)}catch(e){}a.remove()},500)}
      function badgeFor(n){if(n.type==="folder")return"FOLDER";var e=(n.ext||extOf(n.name)||"file").toUpperCase();return e}
      function renderCrumbs(){crumbs.innerHTML="";function mk(label,depth){var c=document.createElement("div");c.className="crumb";c.textContent=label;c.addEventListener("click",function(){var segs=CURRENT_PATH.slice(0,depth);var id=findFolderByPath(segs);gotoFolder(id,false)});return c}crumbs.appendChild(mk("FavStorage",0));for(var i=0;i<CURRENT_PATH.length;i++){var s=document.createElement("div");s.className="sep";s.textContent=">";crumbs.appendChild(s);crumbs.appendChild(mk(CURRENT_PATH[i],i+1))}$("#folderTitle").textContent=CURRENT_PATH.length?CURRENT_PATH[CURRENT_PATH.length-1]:"Root"}
      function openItemMenu(n){var bodyNode=document.createElement("div");bodyNode.style.display="flex";bodyNode.style.flexWrap="wrap";bodyNode.style.gap="10px";function mkBtn(txt,cls,fn){var b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=txt;b.addEventListener("click",async function(){try{await fn()}finally{closeModal()}});return b}bodyNode.appendChild(mkBtn("Rename","yellow",function(){promptRename(n)}));if(n.type==="folder"){bodyNode.appendChild(mkBtn("Open","blue",function(){gotoFolder(n.id,false)}));bodyNode.appendChild(mkBtn("Delete","red",function(){return deleteNode(n.id)}))}else{bodyNode.appendChild(mkBtn("Open","blue",function(){return openViewer(n)}));bodyNode.appendChild(mkBtn("Download","",async function(){var blob=await idbGet(n.id);if(blob)downloadBlob(blob,n.name)}));bodyNode.appendChild(mkBtn("Delete","red",function(){return deleteNode(n.id)}))}var closeBtn=document.createElement("button");closeBtn.className="btn ghost";closeBtn.textContent="Close";closeBtn.addEventListener("click",closeModal);openModal(n.name,bodyNode,[closeBtn])}
