scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
const container = document.getElementById('canvas');
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(5, 10, 7);
scene.add(directionalLight);
const sphereGeometry = new THREE.SphereGeometry(5, 64, 64);
const sphereMaterial = new THREE.MeshPhongMaterial({
color: 0x0a0a0a,
emissive: 0x111122,
shininess: 30,
transparent: true,
opacity: 0.7
});
const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
scene.add(sphere);
camera.position.z = 14;
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.25;
controls.enableZoom = true;
controls.minDistance = 10;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const sprites = [];
function createLabel(text) {
const canvas = document.createElement('canvas');
canvas.width = 256;
canvas.height = 128;
const ctx = canvas.getContext('2d');
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.font = 'bold 28px system-ui';
ctx.fillStyle = '#ffffff';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(text, canvas.width/2, canvas.height/2);
const texture = new THREE.CanvasTexture(canvas);
const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
const sprite = new THREE.Sprite(material);
sprite.scale.set(3, 1.5, 1);
return sprite;
}
const goldenRatio = (1 + Math.sqrt(5)) / 2;
const radius = 5.3;
SERVICES.forEach((service, i) => {
const y = (i / SERVICES.length) * 2 - 1;
const phi = Math.acos(y);
const theta = 2 * Math.PI * i * goldenRatio;
const x = Math.cos(theta) * Math.sin(phi) * radius;
const z = Math.sin(theta) * Math.sin(phi) * radius;
const yPos = y * radius;
const sprite = createLabel(service.name);
sprite.position.set(x, yPos, z);
sprite.userData = service;
scene.add(sprite);
sprites.push(sprite);
});
function animate() {
requestAnimationFrame(animate);
controls.update();
sphere.rotation.y += 0.0005;
renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
camera.aspect = container.clientWidth / container.clientHeight;
camera.updateProjectionMatrix();
renderer.setSize(container.clientWidth, container.clientHeight);
});
container.addEventListener('click', (event) => {
const rect = container.getBoundingClientRect();
mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
raycaster.setFromCamera(mouse, camera);
const intersects = raycaster.intersectObjects(sprites);
if (intersects.length > 0) {
const service = intersects[0].object.userData;
renderModal(service);
}
});
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modalContent');
const closeModal = document.getElementById('closeModal');
closeModal.addEventListener('click', () => {
modal.classList.remove('active');
});
function renderModal(service) {
const chips = service.tags.map(t => `<span class="chip">${t}</span>`).join('');
let groupsHtml = '';
for (const [title, items] of Object.entries(service.groups)) {
groupsHtml += `
<div class="group">
<h3>${title}</h3>
<ul>
${items.map(item => `<li>${item}</li>`).join('')}
</ul>
</div>
`;
}
modalContent.innerHTML = `
<div style="max-width:900px;width:100%;margin:auto;background:rgba(255,255,255,0.03);border-radius:22px;padding:30px;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(12px);">
<div style="font-size:32px;font-weight:800;margin-bottom:12px;">${service.name}</div>
<div style="font-size:16px;color:rgba(245,245,245,0.7);margin-bottom:24px;">${service.desc}</div>
<div class="chips" style="margin-bottom:24px;">${chips}</div>
${groupsHtml}
<div class="note">Need something not listed? Just ask — new branches grow fast.</div>
</div>
`;
modal.classList.add('active');
}
function normalize(str) {
return str.toLowerCase();
}
function highlight(term) {
const t = term ? normalize(term) : '';
sprites.forEach(sprite => {
const service = sprite.userData;
const text = normalize(service.name + ' ' + (service.tags || []).join(' '));
const match = t === '' || text.includes(t);
sprite.material.opacity = match ? 1 : 0.3;
sprite.scale.set(match ? 3.5 : 3, match ? 1.75 : 1.5, 1);
});
}
document.getElementById('q').addEventListener('input', e => highlight(e.target.value));
</script>
</body>
</html>
