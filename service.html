    const nodesGroup = document.getElementById("nodes");
    const panelTitle = document.getElementById("pt");
    const panelSub = document.getElementById("ps");
    const panelBody = document.getElementById("panelBody");
    const q = document.getElementById("q");

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function normalize(text) {
      return String(text || "").toLowerCase().trim();
    }

    function allTextOf(service) {
      const groupText = Object.entries(service.groups || {})
        .map(([g, items]) => g + " " + (items || []).join(" "))
        .join(" ");
      return normalize(service.name + " " + service.desc + " " + (service.tags || []).join(" ") + " " + groupText);
    }

    function renderNodes() {
      nodesGroup.innerHTML = "";

      for (const s of SERVICES) {
        const g = svgEl("g");
        g.dataset.id = s.id;
        g.style.cursor = "pointer";

        const c = svgEl("circle", {
          cx: s.x,
          cy: s.y,
          r: s.id === "root" ? 14 : 11
        });
        c.classList.add("node");

        const tx = svgEl("text", {
          x: s.x + (s.x < 600 ? 18 : -18),
          y: s.y + 4
        });
        tx.classList.add("label");
        tx.classList.add(s.id === "root" ? "" : "dim");
        tx.setAttribute("text-anchor", s.x < 600 ? "start" : "end");
        tx.textContent = s.name;

        g.appendChild(c);
        g.appendChild(tx);

        g.addEventListener("click", () => selectNode(s.id));

        nodesGroup.appendChild(g);
      }
    }

    function setActiveCircle(id) {
      document.querySelectorAll("circle.node").forEach(n => n.classList.remove("active"));
      const g = [...nodesGroup.children].find(el => el.dataset.id === id);
      if (!g) return;
      const c = g.querySelector("circle");
      if (c) c.classList.add("active");
    }

    function renderPanel(service, term = "") {
      panelTitle.textContent = service.name;
      panelSub.textContent = service.desc;

      const t = normalize(term);

      const chipsHtml = (service.tags || [])
        .map(tag => `<span class="chip">${tag}</span>`)
        .join("");

      const groupsHtml = Object.entries(service.groups || {})
        .map(([groupName, items]) => {
          const filtered = (items || []).filter(it => !t || normalize(it).includes(t) || normalize(groupName).includes(t));
          if (!filtered.length) return "";
          return `
            <div class="group">
              <h3>${groupName}</h3>
              <ul>
                ${filtered.map(it => `<li>${it}</li>`).join("")}
              </ul>
            </div>
          `;
        })
        .join("");

      panelBody.innerHTML = `
        <div class="chips">${chipsHtml}</div>
        ${groupsHtml || `<div class="note">No matches for “${term}” in this branch. Try a different search.</div>`}
        <div class="note">Need something not listed? Tell me the exact thing — it gets added as a new branch or leaf.</div>
      `;
    }

    function selectNode(id) {
      const s = SERVICES.find(x => x.id === id);
      if (!s) return;
      setActiveCircle(id);
      renderPanel(s, q.value);
    }

    function highlight(term) {
      const t = normalize(term);

      for (const el of [...nodesGroup.children]) {
        const id = el.dataset.id;
        const s = SERVICES.find(x => x.id === id);
        if (!s) continue;

        const hit = !t || allTextOf(s).includes(t);
        el.style.opacity = hit ? "1" : ".20";

        const label = el.querySelector("text");
        const circle = el.querySelector("circle");

        if (label) label.style.fill = hit ? "rgba(245,245,245,.88)" : "rgba(245,245,245,.22)";
        if (circle) circle.style.stroke = hit ? "rgba(255,255,255,.95)" : "rgba(255,255,255,.18)";
      }

      const active = document.querySelector("circle.node.active");
      const activeGroup = active ? active.closest("g") : null;
      const activeId = activeGroup ? activeGroup.dataset.id : "root";
      const activeService = SERVICES.find(x => x.id === activeId) || SERVICES[0];
      renderPanel(activeService, term);
    }

    q.addEventListener("input", (e) => highlight(e.target.value));

    renderNodes();
    selectNode("root");
  </script>
